# Saturday final check (run/saturday.py): Friday's injury report, applied to
# the lineup each subscriber was sent on Tuesday. Mails ONLY the subscribers
# whose lineup has to change — a weekly "no changes" email is one people learn
# to skip, and then they skip the one that matters.
#
# No report is rebuilt and no probability is computed, so nothing here touches
# the ledger. It reads three things: the registry (who is paying), the plans
# the Tuesday run stored (what they were told), and nflverse's injury report,
# schedule and player statuses (what is true now).

name: saturday-final-check

on:
  schedule:
    # Saturdays 16:17 UTC — just after noon ET on daylight time, 11:17 ET from Nov 1.
    # Teams playing Sunday file their final injury report on Friday
    # afternoon; nflverse rebuilds its injury release daily around 14:00 UTC
    # (observed on the release's own asset timestamps), so 16:17 reads a file
    # that has Friday in it, with a day left to act on it. run.saturday
    # refuses outright if the week's report is not in yet, rather than
    # reading a missing report as a healthy league.
    - cron: "17 16 * * 6"
  # The form Worker (infra/form-worker.js) also dispatches this at 16:17 UTC
  # on Saturdays, because GitHub's scheduler runs late or not at all; the
  # cron above is the backup. A double trigger is safe: see the checkout.
  workflow_dispatch: {}

# One run at a time: two runs reading the same committed send log can mail the
# same message twice (the 14:17 UTC daily run fires from BOTH its crons at
# once; found by review, Sep 29 2026).
concurrency:
  group: saturday-final-check
  cancel-in-progress: false

permissions:
  contents: write   # persist sent.jsonl — it is what stops a second send
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ref = the branch TIP, not the commit this run was triggered on. A run
      # queued behind another in the concurrency group would otherwise check
      # out the send log as it was when it was QUEUED — before the run ahead
      # of it pushed — and mail everything that run just mailed. (A double
      # trigger is routine now: the Worker's dispatch plus GitHub's backup.)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt
      - name: Restore subscriber registry
        uses: actions/cache/restore@v4
        with:
          path: data/registry
          key: registry-${{ github.run_id }}
          restore-keys: registry-
      - name: Restore sent lineups
        uses: actions/cache/restore@v4
        with:
          path: data/plans
          key: plans-${{ github.run_id }}
          restore-keys: plans-
      - name: Restore nflverse cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      # EMAIL_PROVIDER unset means dry-run, which exits 1 (NOTHING WAS SENT)
      # only when there was something to send — a quiet Saturday passes.
      - name: Send final checks
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          # Keys every address-derived send-log code and the stop-list check
          # (run/digest.py). Never rotated: rotating it orphans every code.
          LOG_SECRET: ${{ secrets.LOG_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BILLING_PORTAL_URL: ${{ secrets.BILLING_PORTAL_URL }}
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
        run: .venv/bin/python -m run.saturday
      - name: Persist the send log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/processed/sent.jsonl ] && git add data/processed/sent.jsonl || true
          git diff --cached --quiet && echo "nothing to persist" && exit 0
          git commit -m "Saturday final check: send log"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
      # ONE open issue per kind of failure: a later failure comments on the
      # open one instead of opening another (before launch these crons filed
      # 16 near-identical issues, which teaches exactly the wrong habit). The
      # title carries no date for that reason; each comment does. Listed, not
      # searched: the search index can lag a fresh issue by minutes.
      - name: Raise an issue if the check failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Saturday final check failed
        run: |
          body="$(date -u +%Y-%m-%d): the Saturday final check failed, so subscribers whose lineup changed may not have been told.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check in this order: whether this week's injury report was published
          (the log says so), whether the plans cache was restored, the email
          provider credentials."
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty' || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --label bug \
              || gh issue create --title "$TITLE" --body "$body" || true
          fi
