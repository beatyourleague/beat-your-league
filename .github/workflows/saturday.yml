# Saturday final check (run/saturday.py): Friday's injury report, applied to
# the lineup each subscriber was sent on Tuesday. Mails ONLY the subscribers
# whose lineup has to change — a weekly "no changes" email is one people learn
# to skip, and then they skip the one that matters.
#
# No report is rebuilt and no probability is computed, so nothing here touches
# the ledger. It reads three things: the registry (who is paying), the plans
# the Tuesday run stored (what they were told), and nflverse's injury report,
# schedule and player statuses (what is true now).

name: saturday-final-check

on:
  schedule:
    # Saturdays 16:17 UTC — just after noon ET on daylight time, 11:17 ET from Nov 1.
    # Teams playing Sunday file their final injury report on Friday
    # afternoon; nflverse rebuilds its injury release daily around 14:00 UTC
    # (observed on the release's own asset timestamps), so 16:17 reads a file
    # that has Friday in it, with a day left to act on it. run.saturday
    # refuses outright if the week's report is not in yet, rather than
    # reading a missing report as a healthy league.
    - cron: "17 16 * * 6"
  # The form Worker (infra/form-worker.js) also dispatches this at 16:17 UTC
  # on Saturdays, because GitHub's scheduler runs late or not at all; the
  # cron above is the backup. A double trigger is safe: see the checkout.
  workflow_dispatch: {}

# One run at a time: two runs reading the same committed send log can mail the
# same message twice (the 14:17 UTC daily run fires from BOTH its crons at
# once; found by review, Sep 29 2026).
concurrency:
  group: saturday-final-check
  cancel-in-progress: false

# Nothing by default; each job below asks for exactly what it uses (INFRA-14).
permissions: {}

# Three jobs (SEC-1, Oct 2026; weekly.yml says why at length): `check` runs the
# pip-installed packages and pushes nothing, and `commit-record` pushes what it
# handed over from a runner that installs and runs nothing.
# `file-issue` raises the failure issue for either.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read    # the checkout; commit-record pushes the send log
      actions: read     # the sealed registry's and plans' backups, when the cache is gone
    outputs:
      # The commit this job started from, as the checkout action itself reports
      # it (fixed before any step of ours runs), and whether the hand-off below
      # found anything to persist. Its commit job reads both (SEC-1).
      base: ${{ steps.checkout.outputs.commit }}
      staged: ${{ steps.handoff.outputs.staged }}
    steps:
      # ref = the branch TIP, not the commit this run was triggered on. A run
      # queued behind another in the concurrency group would otherwise check
      # out the send log as it was when it was QUEUED — before the run ahead
      # of it pushed — and mail everything that run just mailed. (A double
      # trigger is routine now: the Worker's dispatch plus GitHub's backup.)
      #
      # Actions pinned to a full commit, tag in the comment (INFRA-06), and no
      # token left in .git/config (INFRA-07) — this job has none that can push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Hash-locked, runtime packages only (INFRA-07; requirements.lock).
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements.lock
      # Read-only here: Saturday opens the sealed registry and plans and saves
      # nothing back (run/statebox.py). A file that fails its check stops the
      # run before anybody is told to change a lineup on the strength of it.
      - name: Restore subscriber registry (sealed)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/registry.enc
          key: sealed-registry-${{ github.run_id }}
          restore-keys: sealed-registry-
      - name: Restore sent lineups (sealed)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/plans.enc
          key: sealed-plans-${{ github.run_id }}
          restore-keys: sealed-plans-
      # `python -I -S run/statebox.py`, not the venv: this step holds the job's
      # token for the backup fallback, and -I -S loads no site-packages, so no
      # third-party package (or its .pth startup hook) runs beside it (INFRA-07).
      # ALLOW_EMPTY_REGISTRY: a repo variable set for ONE run to start a lost
      # registry fresh on purpose (LAUNCH.md); unset, a lost copy after anyone
      # was served is a red run, never a Stripe-only rebuild.
      - name: Open the registry and the sent lineups
        id: open
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          GH_TOKEN: ${{ github.token }}
          ALLOW_EMPTY_REGISTRY: ${{ vars.ALLOW_EMPTY_REGISTRY }}
        run: python -I -S run/statebox.py open registry plans --backup
      - name: Restore nflverse cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      # EMAIL_PROVIDER unset means dry-run, which exits 1 (NOTHING WAS SENT)
      # only when there was something to send — a quiet Saturday passes.
      - name: Send final checks
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          # Keys every address-derived send-log code and the stop-list check
          # (run/digest.py). Never rotated: rotating it orphans every code.
          LOG_SECRET: ${{ secrets.LOG_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BILLING_PORTAL_URL: ${{ secrets.BILLING_PORTAL_URL }}
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
          # A game postponed or suspended that the schedule still shows at its
          # old kickoff (run/solo.py POSTPONED_GAMES, LAUNCH.md section 8): a repo
          # variable set for one week, AWAY@HOME. Unset excuses nothing.
          POSTPONED_GAMES: ${{ vars.POSTPONED_GAMES }}
        run: .venv/bin/python -m run.saturday
      # The send log, handed to commit-record, which pushes it from a runner
      # nothing here has touched. `always()`: a failed send still records who
      # WAS mailed — the alternative is mailing them again.
      - name: Hand the record to its commit job
        id: handoff
        if: always()
        env:
          RECORD_PATHS: data/processed/sent.jsonl
        run: |
          set -euo pipefail
          set -f
          stage="$RUNNER_TEMP/record"
          rm -rf "$stage"
          mkdir -p "$stage"
          git ls-files -z --cached --others --exclude-standard -- $RECORD_PATHS |
            while IFS= read -r -d '' path; do
              case "/$path" in */.git*) continue ;; esac
              [ -f "$path" ] && [ ! -L "$path" ] || continue
              mkdir -p "$stage/$(dirname "$path")"
              cp "$path" "$stage/$path"
            done
          if [ -n "$(find "$stage" -type f -print -quit)" ]; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing at the record's paths to hand over"
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi
      # overwrite: a re-run of this job replaces the record its first attempt
      # left, rather than failing on the name and persisting nothing.
      - name: Upload the record
        if: always() && steps.handoff.outputs.staged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saturday-record
          path: ${{ runner.temp }}/record/
          if-no-files-found: error
          overwrite: true


  # The send log, pushed from a runner that installs nothing and runs nothing
  # but git and the shell (SEC-1): the artifact must hold the send log and
  # nothing else, and is laid on the commit `check` started from and rebased,
  # so another cron's lines pushed in between are merged (merge=union), never
  # overwritten. `always()`, as the persist step it replaces had: a failed
  # send still records who WAS mailed. Skipped only when there is no send log
  # yet (before launch), where the old step had nothing to add.
  commit-record:
    needs: check
    if: always() && needs.check.outputs.staged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the record; nothing else
    steps:
      # fetch-depth: 0: the starting commit is checked against this branch's
      # history, and `git pull --rebase` against a shallow history can fail.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      # Outside the checkout: nothing in it reaches the work tree until the
      # check below has passed it.
      - name: Download the record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: saturday-record
          path: ${{ runner.temp }}/record
      - name: Check the record and lay it on the check job's commit
        env:
          BASE: ${{ needs.check.outputs.base }}
          RECORD_ALLOWED: /data/processed/sent.jsonl
        run: |
          set -euo pipefail
          set -f
          record="$RUNNER_TEMP/record"
          # The starting commit must be on this branch: rebasing from anywhere
          # else would push whatever lies between it and here.
          if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$BASE" HEAD; then
            echo "::error::the starting commit is not on this branch; nothing was persisted"
            exit 1
          fi
          odd=$(find "$record" -mindepth 1 ! -type f ! -type d -print -quit)
          if [ -n "$odd" ]; then
            echo "::error::the artifact holds something that is not a plain file; nothing was persisted"
            exit 1
          fi
          files=()
          while IFS= read -r -d '' file; do
            path=${file#"$record"/}
            ok=
            case "/$path" in
              */.git*) ;;
              *) for allowed in $RECORD_ALLOWED; do
                   case "/$path" in $allowed) ok=1 ;; esac
                 done ;;
            esac
            if [ -z "$ok" ]; then
              printf '::error::the artifact holds %q, which this job never commits; nothing was persisted\n' "$path"
              exit 1
            fi
            files+=("$path")
          done < <(find "$record" -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the artifact is empty; nothing was persisted"
            exit 1
          fi
          git reset -q --hard "$BASE"
          for folder in ${RECORD_REPLACES:-}; do
            rm -rf "$folder"
          done
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            cp "$record/$path" "$path"
          done
          echo "${#files[@]} file(s) laid on $BASE"
      # The only step handed a token that can push (the helper reads it from
      # this step's environment; .git/config never holds it).
      - name: Persist the send log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SEC-1: no hook or fsmonitor command an earlier step left in .git (or
          # in any git config file) runs beside the token: config given on the
          # command line outranks them all, for every git call below.
          git() { command git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          [ -f data/processed/sent.jsonl ] && git add data/processed/sent.jsonl || true
          git diff --cached --quiet && echo "nothing to persist" && exit 0
          git commit -m "Saturday final check: send log"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push

  # ONE open issue per kind of failure, for check or the push of what it
  # handed over.
  file-issue:
    needs: [check, commit-record]
    if: always() && (needs.check.result == 'failure' || needs.commit-record.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write     # one open issue per kind of failure
    steps:
      # ONE open issue per kind of failure: a later failure comments on the
      # open one instead of opening another (before launch these crons filed
      # 16 near-identical issues, which teaches exactly the wrong habit). The
      # title carries no date for that reason; each comment does. Listed, not
      # searched: the search index can lag a fresh issue by minutes.
      - name: Raise an issue if the check failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Saturday final check failed
        run: |
          body="$(date -u +%Y-%m-%d): the Saturday final check failed, so subscribers whose lineup changed may not have been told.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Check in this order: whether this week's injury report was published
          (the log says so), whether the sealed plans were restored and opened
          (CACHE_KEY), the email provider credentials. If commit-record is the job
          that failed, the checks went out but the send log never reached the
          branch: Re-run failed jobs pushes the same log."
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty' || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --label bug \
              || gh issue create --title "$TITLE" --body "$body" || true
          fi
