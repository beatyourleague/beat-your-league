# Monday grading run (PLAN.md season ops): settle last week's published calls
# against the real box scores and regenerate the public ledger page. MNF calls
# stay pending until their game is final (ledger RULE L1) and settle on the
# next run.
#
# This drives the ROSTER product (PLAN §0) via run.monday, which grades from
# nflverse and reads no league platform. It replaced `ingest.pull` +
# `run.content receipts`, which could not simply be renamed: that path resolves
# a league id and grades through Sleeper's cached schedule plus the weekly
# availability snapshots only ingest.pull writes, so every typed-* call would
# have stayed PENDING forever — a green cron and an empty public record.
#
# The workflow NAME is load-bearing and must not change: pages.yml triggers its
# republish on `workflow_run` matching the literal string "monday-receipts", so
# renaming this silently stops the public ledger from redeploying, exactly when
# it starts having rows worth showing.
#
# No secrets are needed at all. If the repo variable PUSH_LEDGER is set to
# "true", the refreshed site/ledger/ page is committed back so GitHub Pages
# serves the updated public record.

name: monday-receipts

on:
  schedule:
    # Mondays 13:00 UTC — 09:00 ET on daylight time, 08:00 ET from Nov 1 2026.
    # Deliberately BEFORE Monday Night Football: the Sunday slate settles now
    # and the MNF calls settle next week, because RULE L1 refuses to grade a
    # call whose game is not final rather than guessing at it.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      # fetch-depth: 0 because this job COMMITS BACK. The default is a
      # shallow clone, and `git pull --rebase` against a shallow history
      # can fail — which would break the persist step whose whole job is
      # keeping the record safe.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt
      # Availability and the ledger arrive with the checkout now: they are
      # committed, not cached, because an Actions cache is evicted after 7 days
      # without access and neither can be rebuilt if it is lost.
      # The nflverse download cache, shared with the Tuesday cron.
      - name: Restore nflverse cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      - name: Grade the ledger and republish the record
        run: .venv/bin/python -m run.monday
      - name: Save nflverse cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
      - name: Upload drafts, cards, and ledger page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipts-monday
          # content/ is gone from this list: it is written by run.content,
          # which is the Sleeper-rooted drafting path this cron no longer runs.
          # The content drafts are a separate job to rebuild on the roster
          # stack; leaving a dead path here would quietly thin the artifact.
          path: |
            site/ledger/
            data/processed/ledger/
          if-no-files-found: warn
      # The graded ledger is persisted whether or not the page is published —
      # the record is the asset, the page is only its rendering.
      - name: Persist the graded record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/raw/availability is NOT added: only ingest.pull writes it, and
          # this cron no longer runs it. The committed history stays in the repo
          # (it is unrebuildable) but the path stops accumulating; the roster
          # path builds availability on the fly from the nflverse injury
          # archive instead.
          git add -A data/processed/ledger
          if [ "${{ vars.PUSH_LEDGER }}" = "true" ]; then git add site/ledger/; fi
          git diff --cached --quiet && echo "nothing to persist" && exit 0
          git commit -m "Monday grading run: ledger settled"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
      - name: Raise an issue if grading failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Monday grading failed: $(date -u +%Y-%m-%d)" \
            --body "Grading did not complete, so published calls stay pending and the
          public record is stale.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label bug || true
