# Monday grading run (PLAN.md season ops): settle last week's published calls
# against the real box scores and regenerate the public ledger page. MNF calls
# stay pending until their game is final (ledger RULE L1) and settle on the
# next run.
#
# This drives the ROSTER product (PLAN §0) via run.monday, which grades from
# nflverse and reads no league platform. It replaced `ingest.pull` +
# `run.content receipts`, which could not simply be renamed: that path resolves
# a league id and grades through Sleeper's cached schedule plus the weekly
# availability snapshots only ingest.pull writes, so every typed-* call would
# have stayed PENDING forever — a green cron and an empty public record.
#
# The workflow NAME is load-bearing and must not change: pages.yml triggers its
# republish on `workflow_run` matching the literal string "monday-receipts", so
# renaming this silently stops the public ledger from redeploying, exactly when
# it starts having rows worth showing.
#
# No secrets are needed at all. The refreshed site/ledger/ page is committed
# back by default so GitHub Pages serves the updated public record; set the repo
# variable PUSH_LEDGER to "false" to hold it back deliberately.

name: monday-receipts

on:
  schedule:
    # Mondays 13:17 UTC — 09:17 ET on daylight time, 08:00 ET from Nov 1 2026.
    # Deliberately BEFORE Monday Night Football: the Sunday slate settles now
    # and the MNF calls settle next week, because RULE L1 refuses to grade a
    # call whose game is not final rather than guessing at it.
    - cron: "17 13 * * 1"
  # The form Worker (infra/form-worker.js) also dispatches this at 13:17 UTC
  # on Mondays, because GitHub's scheduler runs late or not at all; the cron
  # above is the backup.
  workflow_dispatch: {}

# One run at a time, queued rather than cancelled. Grading twice is harmless —
# a settled call is immutable (RULE L4) and the second run, checking out the
# tip, finds it settled — but two runs committing the ledger at once is a push
# race for nothing.
concurrency:
  group: monday-receipts
  cancel-in-progress: false

# Nothing by default; each job below asks for exactly what it uses (INFRA-14).
permissions: {}

# Three jobs (SEC-1, Oct 2026; weekly.yml says why at length): `receipts` runs
# the pip-installed packages and pushes nothing, `commit-record` pushes what it
# handed over from a runner that installs and runs nothing, and `file-issue`
# raises the failure issue for either.
jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read    # the checkout; commit-record pushes the graded record
    outputs:
      # The commit this job started from, as the checkout action itself reports
      # it (fixed before any step of ours runs), and whether the hand-off below
      # found anything to persist. Its commit job reads both (SEC-1).
      base: ${{ steps.checkout.outputs.commit }}
      staged: ${{ steps.handoff.outputs.staged }}
    steps:
      # ref = the branch TIP, not the commit this run was triggered on. A run
      # queued behind another in the concurrency group would otherwise check
      # out the ledger as it was when it was QUEUED — before the run ahead
      # of it pushed — and grade from a stale record. (A double trigger is
      # routine now: the Worker's dispatch plus GitHub's backup.)
      #
      # Actions pinned to a full commit, tag in the comment (INFRA-06), and no
      # token left in .git/config (INFRA-07) — this job has none that can push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Hash-locked, runtime packages only (INFRA-07; requirements.lock).
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements.lock
      # Availability and the ledger arrive with the checkout now: they are
      # committed, not cached, because an Actions cache is evicted after 7 days
      # without access and neither can be rebuilt if it is lost.
      # The nflverse download cache, shared with the Tuesday cron.
      - name: Restore nflverse cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      - name: Grade the ledger and republish the record
        run: .venv/bin/python -m run.monday
      # The public drafts, from the record the step above just settled — and
      # ONLY from it: run/posts.py cannot reach a subscriber's file. Never
      # posted automatically; a human edits voice and approves (PLAN §5), so
      # these ride the artifact rather than any outbound channel. Runs even if
      # grading exited non-zero: last week's settled calls are still worth
      # drafting from, and the failure is reported by its own step below.
      - name: Draft the public posts
        if: always()
        run: .venv/bin/python -m run.posts all
      - name: Save nflverse cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
      - name: Upload drafts, cards, and ledger page
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: receipts-monday
          # content/ is back: run/posts.py rebuilt the drafts on the roster
          # product's own record (run/content.py was Sleeper-rooted and
          # produced nothing here). Drafts are for a human to edit before
          # posting, so the artifact is where they go.
          path: |
            content/
            site/ledger/
            data/processed/ledger/
          if-no-files-found: warn
      # The republished page's inline-script hashes (site/_headers), re-derived
      # before the hand-off so they travel with the page. Same opt-out as the
      # page itself.
      - name: Refresh the security headers
        if: always() && vars.PUSH_LEDGER != 'false'
        run: .venv/bin/python -m render.headers
      # The graded ledger, the page and its headers, handed to commit-record,
      # which pushes them from a runner nothing here has touched. `always()`:
      # the graded ledger is persisted whether or not the page is published or
      # grading finished — the record is the asset. The page is staged either
      # way; PUSH_LEDGER decides in commit-record whether it is committed.
      - name: Hand the record to its commit job
        id: handoff
        if: always()
        env:
          RECORD_PATHS: data/processed/ledger site/ledger site/_headers
        run: |
          set -euo pipefail
          set -f
          stage="$RUNNER_TEMP/record"
          rm -rf "$stage"
          mkdir -p "$stage"
          git ls-files -z --cached --others --exclude-standard -- $RECORD_PATHS |
            while IFS= read -r -d '' path; do
              case "/$path" in */.git*) continue ;; esac
              [ -f "$path" ] && [ ! -L "$path" ] || continue
              mkdir -p "$stage/$(dirname "$path")"
              cp "$path" "$stage/$path"
            done
          if [ -n "$(find "$stage" -type f -print -quit)" ]; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing at the record's paths to hand over"
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi
      # overwrite: a re-run of this job replaces the record its first attempt
      # left, rather than failing on the name and persisting nothing.
      - name: Upload the record
        if: always() && steps.handoff.outputs.staged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monday-record
          path: ${{ runner.temp }}/record/
          if-no-files-found: error
          overwrite: true

  # The graded record, pushed from a runner that installs nothing and runs
  # nothing but git and the shell (SEC-1): the artifact must hold plain files
  # at the record's paths and nothing else, and is laid on the commit
  # `receipts` started from and rebased, so the Tuesday run's or the hourly
  # intake's ledger lines pushed in between are merged (merge=union), never
  # overwritten. `always()`, as the persist step it replaces had.
  commit-record:
    needs: receipts
    if: always() && needs.receipts.outputs.staged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the record; nothing else
    steps:
      # fetch-depth: 0: the starting commit is checked against this branch's
      # history, and `git pull --rebase` against a shallow history can fail.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      # Outside the checkout: nothing in it reaches the work tree until the
      # check below has passed it.
      - name: Download the record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: monday-record
          path: ${{ runner.temp }}/record
      - name: Check the record and lay it on the receipts job's commit
        env:
          BASE: ${{ needs.receipts.outputs.base }}
          RECORD_ALLOWED: /data/processed/ledger/* /site/ledger/* /site/_headers
        run: |
          set -euo pipefail
          set -f
          record="$RUNNER_TEMP/record"
          # The starting commit must be on this branch: rebasing from anywhere
          # else would push whatever lies between it and here.
          if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$BASE" HEAD; then
            echo "::error::the starting commit is not on this branch; nothing was persisted"
            exit 1
          fi
          odd=$(find "$record" -mindepth 1 ! -type f ! -type d -print -quit)
          if [ -n "$odd" ]; then
            echo "::error::the artifact holds something that is not a plain file; nothing was persisted"
            exit 1
          fi
          files=()
          while IFS= read -r -d '' file; do
            path=${file#"$record"/}
            ok=
            case "/$path" in
              */.git*) ;;
              *) for allowed in $RECORD_ALLOWED; do
                   case "/$path" in $allowed) ok=1 ;; esac
                 done ;;
            esac
            if [ -z "$ok" ]; then
              printf '::error::the artifact holds %q, which this job never commits; nothing was persisted\n' "$path"
              exit 1
            fi
            files+=("$path")
          done < <(find "$record" -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the artifact is empty; nothing was persisted"
            exit 1
          fi
          git reset -q --hard "$BASE"
          for folder in ${RECORD_REPLACES:-}; do
            rm -rf "$folder"
          done
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            cp "$record/$path" "$path"
          done
          echo "${#files[@]} file(s) laid on $BASE"
      # The graded ledger is persisted whether or not the page is published —
      # the record is the asset, the page is only its rendering.
      #
      # The only step handed a token that can push (the credential helper reads
      # it from this step's environment; .git/config never holds it), and the
      # repo variable arrives as an environment value, never pasted into the
      # shell (INFRA-14).
      - name: Persist the graded record
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_LEDGER: ${{ vars.PUSH_LEDGER }}
        run: |
          # SEC-1: no hook or fsmonitor command an earlier step left in .git (or
          # in any git config file) runs beside the token: config given on the
          # command line outranks them all, for every git call below.
          git() { command git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          # data/raw/availability is NOT added: only ingest.pull writes it, and
          # this cron no longer runs it. The committed history stays in the repo
          # (it is unrebuildable) but the path stops accumulating; the roster
          # path builds availability on the fly from the nflverse injury
          # archive instead.
          git add -A data/processed/ledger
          # The page is COMMITTED BY DEFAULT. This used to be gated on the
          # repo variable PUSH_LEDGER being "true" — undocumented and unset —
          # so every Monday regenerated the public record and threw it away.
          # Principle 2 is "grade everything publicly"; a record that never
          # publishes is not a record. Set PUSH_LEDGER to "false" to hold it
          # back deliberately (e.g. before launch), which is the opposite
          # default and the safe direction for a promise about honesty.
          # The page's inline-script hashes go with it (site/_headers, made in
          # the receipts job), so the republished page never meets a stale
          # Content-Security-Policy.
          if [ "$PUSH_LEDGER" != "false" ]; then
            git add site/ledger/ site/_headers
          fi
          git diff --cached --quiet && echo "nothing to persist" && exit 0
          git commit -m "Monday grading run: ledger settled"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push

  # ONE open issue per kind of failure, for the grading job or the push of
  # what it graded: either leaves published calls pending and the public
  # record stale.
  file-issue:
    needs: [receipts, commit-record]
    if: always() && (needs.receipts.result == 'failure' || needs.commit-record.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write     # one open issue per kind of failure
    steps:
      # ONE open issue per kind of failure: a later failure comments on the
      # open one instead of opening another (before launch these crons filed
      # 16 near-identical issues, which teaches exactly the wrong habit). The
      # title carries no date for that reason; each comment does. Listed, not
      # searched: the search index can lag a fresh issue by minutes.
      - name: Raise an issue if grading failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Monday grading failed
        run: |
          body="$(date -u +%Y-%m-%d): grading did not complete, so published calls stay pending and the
          public record is stale. If commit-record is the job that failed, grading ran but
          its result never reached the branch: Re-run failed jobs pushes the same record.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty' || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --label bug \
              || gh issue create --title "$TITLE" --body "$body" || true
          fi
