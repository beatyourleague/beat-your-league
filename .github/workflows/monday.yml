# Monday grading run (PLAN.md season ops): settle the ledger against the
# weekend's box scores, render receipt cards, regenerate the public ledger
# page, and draft the Receipts Monday thread. MNF calls stay pending until
# their game is final (ledger RULE L1) and settle on the next run.
#
# Activates on push to GitHub with SLEEPER_LEAGUE_ID + SLEEPER_ROSTER_ID
# secrets. Outputs upload as artifacts; if the repo variable PUSH_LEDGER is
# set to "true", the refreshed site/ledger/ page is committed back so GitHub
# Pages serves the updated public record.

name: monday-receipts

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (9am ET — Sunday slate final)
  workflow_dispatch: {}

jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt
      # Availability and the ledger arrive with the checkout now: they are
      # committed, not cached, because an Actions cache is evicted after 7 days
      # without access and neither can be rebuilt if it is lost.
      - name: Ingest fresh box scores
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        run: .venv/bin/python -m ingest.pull
      - name: Grade ledger + draft Receipts Monday
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          SLEEPER_ROSTER_ID: ${{ secrets.SLEEPER_ROSTER_ID }}
        run: .venv/bin/python -m run.content receipts
      - name: Upload drafts, cards, and ledger page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipts-monday
          path: |
            content/
            site/ledger/
            data/processed/ledger/
          if-no-files-found: warn
      # The graded ledger is persisted whether or not the page is published —
      # the record is the asset, the page is only its rendering.
      - name: Persist the graded record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/processed/ledger data/raw/availability
          if [ "${{ vars.PUSH_LEDGER }}" = "true" ]; then git add site/ledger/; fi
          git diff --cached --quiet && echo "nothing to persist" && exit 0
          git commit -m "Monday grading run: ledger settled"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
      - name: Raise an issue if grading failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Monday grading failed: $(date -u +%Y-%m-%d)" \
            --body "Grading did not complete, so published calls stay pending and the
          public record is stale.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label bug || true
