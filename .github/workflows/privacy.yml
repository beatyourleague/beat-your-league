# One person's data: show, export or delete it (run/privacy.py, D5).
#
# The privacy policy promises access, correction, deletion and portability
# within 30 days. The registry lives only in this repo's Actions cache and its
# backup artifacts, sealed (run/statebox.py), so the request is run here:
# restore and open them, act, seal and save fresh copies, and delete the older
# cache entries and backups that still hold the person's rows.
#
# The input is a KEYED CODE, never an address — this repo is public and the
# dispatch inputs show in the log. Make it on your own machine:
#     LOG_SECRET=... .venv/bin/python -m run.privacy code their@address
# The results go to the hello@ inbox only; the log carries counts.
#
# Every action needs the owner's approval code (run/approval.py, final review
# SEC-2), made on the owner's own machine for the exact action and code:
#     LOG_SECRET=... .venv/bin/python -m run.approval privacy delete <12-hex code>
# The form Worker's dispatch token can start this workflow, and the 12-hex
# code of anyone on the waitlist or sent a free report is readable in the
# public send log — but the token cannot make the approval, so it cannot
# erase a subscriber or read counts into this public log.
#
# Shares the daily intake's concurrency group, so it never runs beside the
# hourly sweep that also saves the registry. Avoid Tuesday 12:00-17:00 UTC
# (the weekly send saves it too); `show` afterwards confirms nothing is left.
name: privacy-request

on:
  workflow_dispatch:
    inputs:
      action:
        description: "show (counts) · export (everything, to hello@) · delete"
        type: choice
        options: [show, export, delete]
        default: show
      code:
        description: "The person's 12-hex keyed code (python -m run.privacy code <email>, locally) — never an address"
        type: string
        required: true
      approval:
        description: "The owner's code for this action and code (python -m run.approval privacy ACTION CODE, locally)"
        type: string
        required: true

concurrency:
  group: daily-intake
  cancel-in-progress: false

# Nothing by default; each job below asks for exactly what it uses (INFRA-14).
permissions: {}

# Two jobs (SEC-1, Oct 2026; weekly.yml says why at length): `privacy` runs the
# pip-installed packages and pushes nothing, and `commit-record` pushes what it
# handed over from a runner that installs and runs nothing.
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read    # the checkout; commit-record pushes the two lists
      actions: write    # delete the older caches and backups that still hold the rows
    outputs:
      # The commit this job started from, as the checkout action itself reports
      # it (fixed before any step of ours runs), and whether the hand-off below
      # found anything to persist. Its commit job reads both (SEC-1).
      base: ${{ steps.checkout.outputs.commit }}
      staged: ${{ steps.handoff.outputs.staged }}
    steps:
      # Actions pinned to a full commit, tag in the comment (INFRA-06), and no
      # token left in .git/config (INFRA-07) — this job has none that can push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Hash-locked, runtime packages only (INFRA-07; requirements.lock).
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements.lock
      # Before anything is restored, opened or read: the owner's code for this
      # exact action and person (SEC-2). Every action, `show` included — its
      # counts land in this public log.
      - name: Check the owner's approval
        env:
          ACTION: ${{ github.event.inputs.action }}
          CODE: ${{ github.event.inputs.code }}
          APPROVAL: ${{ github.event.inputs.approval }}
          LOG_SECRET: ${{ secrets.LOG_SECRET }}
        run: .venv/bin/python -m run.approval verify privacy "$APPROVAL" "$ACTION" "$CODE"
      - name: Restore subscriber registry (sealed)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/registry.enc
          key: sealed-registry-${{ github.run_id }}
          restore-keys: sealed-registry-
      - name: Restore stored plans (sealed)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/plans.enc
          key: sealed-plans-${{ github.run_id }}
          restore-keys: sealed-plans-
      # `python -I -S run/statebox.py`, not the venv: this step holds the job's
      # token for the backup fallback, and -I -S loads no site-packages, so no
      # third-party package (or its .pth startup hook) runs beside it (INFRA-07).
      # ALLOW_EMPTY_REGISTRY: a repo variable set for ONE run to start a lost
      # registry fresh on purpose (LAUNCH.md); unset, a lost copy after anyone
      # was served is a red run, never a Stripe-only rebuild.
      - name: Open the registry and the stored plans
        id: open
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          GH_TOKEN: ${{ github.token }}
          ALLOW_EMPTY_REGISTRY: ${{ vars.ALLOW_EMPTY_REGISTRY }}
        run: python -I -S run/statebox.py open registry plans --backup
      - name: Act on the request
        id: privacy
        env:
          ACTION: ${{ github.event.inputs.action }}
          CODE: ${{ github.event.inputs.code }}
          LOG_SECRET: ${{ secrets.LOG_SECRET }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BILLING_PORTAL_URL: ${{ secrets.BILLING_PORTAL_URL }}
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
          FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
          FORM_API_KEY: ${{ secrets.FORM_API_KEY }}
        run: .venv/bin/python -m run.privacy "$ACTION" "$CODE" --send
      - name: Seal the edited registry and plans
        id: seal
        if: success() && github.event.inputs.action == 'delete'
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          STRIPE_KEY_SET: ${{ secrets.STRIPE_API_KEY != '' }}
        run: python -I -S run/statebox.py seal registry plans
      - name: Save subscriber registry (sealed)
        if: success() && github.event.inputs.action == 'delete' && steps.seal.outputs.registry_sealed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/registry.enc
          key: sealed-registry-${{ github.run_id }}
      - name: Save stored plans (sealed)
        if: success() && github.event.inputs.action == 'delete' && steps.seal.outputs.plans_sealed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/plans.enc
          key: sealed-plans-${{ github.run_id }}
      # The fresh backups FIRST, so pruning the older ones below never leaves
      # no backup at all (run/statebox.py RULE S3 and S4).
      - name: Back up the edited registry
        if: success() && github.event.inputs.action == 'delete' && steps.seal.outputs.registry_sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-registry
          path: data/sealed/registry.enc
          retention-days: 90
          if-no-files-found: error
      - name: Back up the edited plans
        if: success() && github.event.inputs.action == 'delete' && steps.seal.outputs.plans_sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-plans
          path: data/sealed/plans.enc
          retention-days: 90
          if-no-files-found: error
      # The fresh copies above are now the newest, so every restore picks them.
      # The older entries still hold the deleted rows (encrypted, but held)
      # until GitHub evicts them (7 days unused) or they expire (90 days);
      # delete them now rather than wait. The pre-sealing `registry-`/`plans-`
      # caches, if any were ever made, are plain text and all go.
      #
      # EVERY older one: hourly runs keep a week of cache entries (well past
      # 100), so each prefix is re-listed until nothing but this run's key is
      # left rather than read once to a --limit, and statebox pages through
      # every backup before deleting. A rate limit part-way stops the step
      # red; running the same delete again finds the person gone and finishes.
      # gh is the runner's own binary and statebox runs under -I -S, so this
      # Actions: write token never sits in a process with a third-party package.
      - name: Delete the older caches and backups that still hold the rows
        if: success() && github.event.inputs.action == 'delete'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Every key under a prefix but $2, until a fresh listing shows none.
          drain() {
            local prefix="$1" keep="${2:-}" keys passes=0
            while :; do
              keys=$(gh cache list --key "$prefix" --limit 1000 --json key --jq '.[].key' |
                grep -v -x -F -e "${keep:-(none)}" || true)
              [ -z "$keys" ] && return 0
              passes=$((passes + 1))
              if [ "$passes" -gt 20 ]; then
                echo "caches under $prefix are still listed after 20 passes" >&2
                return 1
              fi
              while read -r key; do gh cache delete "$key"; done <<< "$keys"
            done
          }
          drain sealed-registry- "sealed-registry-${GITHUB_RUN_ID}"
          drain sealed-plans- "sealed-plans-${GITHUB_RUN_ID}"
          drain registry-
          drain plans-
          python -I -S run/statebox.py prune registry plans --keep-run "$GITHUB_RUN_ID"
      # The stop list and the forgotten-customer list, handed to commit-record,
      # which pushes them from a runner nothing here has touched — after the
      # older copies above are gone, as before.
      - name: Hand the record to its commit job
        id: handoff
        if: success() && github.event.inputs.action == 'delete'
        env:
          RECORD_PATHS: data/processed/suppressed.txt data/processed/forgotten.txt
        run: |
          set -euo pipefail
          set -f
          stage="$RUNNER_TEMP/record"
          rm -rf "$stage"
          mkdir -p "$stage"
          git ls-files -z --cached --others --exclude-standard -- $RECORD_PATHS |
            while IFS= read -r -d '' path; do
              case "/$path" in */.git*) continue ;; esac
              [ -f "$path" ] && [ ! -L "$path" ] || continue
              mkdir -p "$stage/$(dirname "$path")"
              cp "$path" "$stage/$path"
            done
          if [ -n "$(find "$stage" -type f -print -quit)" ]; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing at the record's paths to hand over"
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi
      # overwrite: a re-run of this job replaces the record its first attempt
      # left, rather than failing on the name and persisting nothing.
      - name: Upload the record
        if: success() && github.event.inputs.action == 'delete' && steps.handoff.outputs.staged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: privacy-record
          path: ${{ runner.temp }}/record/
          if-no-files-found: error
          overwrite: true


  # The two lists, pushed from a runner that installs nothing and runs
  # nothing but git and the shell (SEC-1): the artifact must hold those two
  # files and nothing else, and is laid on the commit `privacy` started from
  # and rebased. Only after a delete that succeeded, as the step it replaces.
  commit-record:
    needs: privacy
    if: github.event.inputs.action == 'delete' && needs.privacy.outputs.staged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the record; nothing else
    steps:
      # fetch-depth: 0: the starting commit is checked against this branch's
      # history, and `git pull --rebase` against a shallow history can fail.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      # Outside the checkout: nothing in it reaches the work tree until the
      # check below has passed it.
      - name: Download the record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: privacy-record
          path: ${{ runner.temp }}/record
      - name: Check the record and lay it on the privacy job's commit
        env:
          BASE: ${{ needs.privacy.outputs.base }}
          RECORD_ALLOWED: /data/processed/suppressed.txt /data/processed/forgotten.txt
        run: |
          set -euo pipefail
          set -f
          record="$RUNNER_TEMP/record"
          # The starting commit must be on this branch: rebasing from anywhere
          # else would push whatever lies between it and here.
          if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$BASE" HEAD; then
            echo "::error::the starting commit is not on this branch; nothing was persisted"
            exit 1
          fi
          odd=$(find "$record" -mindepth 1 ! -type f ! -type d -print -quit)
          if [ -n "$odd" ]; then
            echo "::error::the artifact holds something that is not a plain file; nothing was persisted"
            exit 1
          fi
          files=()
          while IFS= read -r -d '' file; do
            path=${file#"$record"/}
            ok=
            case "/$path" in
              */.git*) ;;
              *) for allowed in $RECORD_ALLOWED; do
                   case "/$path" in $allowed) ok=1 ;; esac
                 done ;;
            esac
            if [ -z "$ok" ]; then
              printf '::error::the artifact holds %q, which this job never commits; nothing was persisted\n' "$path"
              exit 1
            fi
            files+=("$path")
          done < <(find "$record" -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the artifact is empty; nothing was persisted"
            exit 1
          fi
          git reset -q --hard "$BASE"
          for folder in ${RECORD_REPLACES:-}; do
            rm -rf "$folder"
          done
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            cp "$record/$path" "$path"
          done
          echo "${#files[@]} file(s) laid on $BASE"
      # The only step handed a token that can push (the credential helper reads
      # it from this step's environment; .git/config never holds it).
      - name: Commit the stop list and the forgotten-customer list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SEC-1: no hook or fsmonitor command an earlier step left in .git (or
          # in any git config file) runs beside the token: config given on the
          # command line outranks them all, for every git call below.
          git() { command git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          [ -f data/processed/suppressed.txt ] && git add data/processed/suppressed.txt || true
          [ -f data/processed/forgotten.txt ] && git add -f data/processed/forgotten.txt || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Privacy request: deletion applied"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
