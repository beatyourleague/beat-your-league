# One person's data: show, export or delete it (run/privacy.py, D5).
#
# The privacy policy promises access, correction, deletion and portability
# within 30 days. The registry lives only in this repo's Actions cache and its
# backup artifacts, sealed (run/statebox.py), so the request is run here:
# restore and open them, act, seal and save fresh copies, and delete the older
# cache entries and backups that still hold the person's rows.
#
# The input is a KEYED CODE, never an address — this repo is public and the
# dispatch inputs show in the log. Make it on your own machine:
#     LOG_SECRET=... .venv/bin/python -m run.privacy code their@address
# The results go to the hello@ inbox only; the log carries counts.
#
# Shares the daily intake's concurrency group, so it never runs beside the
# hourly sweep that also saves the registry. Avoid Tuesday 12:00-17:00 UTC
# (the weekly send saves it too); `show` afterwards confirms nothing is left.
name: privacy-request

on:
  workflow_dispatch:
    inputs:
      action:
        description: "show (counts) · export (everything, to hello@) · delete"
        type: choice
        options: [show, export, delete]
        default: show
      code:
        description: "The person's 12-hex keyed code (python -m run.privacy code <email>, locally) — never an address"
        type: string
        required: true

concurrency:
  group: daily-intake
  cancel-in-progress: false

# Nothing by default; the job below asks for exactly what it uses (INFRA-14).
permissions: {}

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commit the stop list and the forgotten-customer list
      actions: write    # delete the older caches and backups that still hold the rows
    steps:
      # Actions pinned to a full commit, tag in the comment (INFRA-06), and the
      # push token kept out of .git/config until the commit step (INFRA-07).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Hash-locked, runtime packages only (INFRA-07; requirements.lock).
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Restore subscriber registry (sealed)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/registry.enc
          key: sealed-registry-${{ github.run_id }}
          restore-keys: sealed-registry-
      - name: Restore stored plans (sealed)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/plans.enc
          key: sealed-plans-${{ github.run_id }}
          restore-keys: sealed-plans-
      - name: Open the registry and the stored plans
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python -m run.statebox open registry plans --backup
      - name: Act on the request
        id: privacy
        env:
          ACTION: ${{ github.event.inputs.action }}
          CODE: ${{ github.event.inputs.code }}
          LOG_SECRET: ${{ secrets.LOG_SECRET }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BILLING_PORTAL_URL: ${{ secrets.BILLING_PORTAL_URL }}
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
          FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
          FORM_API_KEY: ${{ secrets.FORM_API_KEY }}
        run: .venv/bin/python -m run.privacy "$ACTION" "$CODE" --send
      - name: Seal the edited registry and plans
        id: seal
        if: success() && github.event.inputs.action == 'delete'
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          STRIPE_KEY_SET: ${{ secrets.STRIPE_API_KEY != '' }}
        run: .venv/bin/python -m run.statebox seal registry plans
      - name: Save subscriber registry (sealed)
        if: success() && github.event.inputs.action == 'delete' && steps.seal.outputs.registry_sealed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/registry.enc
          key: sealed-registry-${{ github.run_id }}
      - name: Save stored plans (sealed)
        if: success() && github.event.inputs.action == 'delete' && steps.seal.outputs.plans_sealed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/plans.enc
          key: sealed-plans-${{ github.run_id }}
      # The fresh backups FIRST, so pruning the older ones below never leaves
      # no backup at all (run/statebox.py RULE S3 and S4).
      - name: Back up the edited registry
        if: success() && github.event.inputs.action == 'delete' && steps.seal.outputs.registry_sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-registry
          path: data/sealed/registry.enc
          retention-days: 90
          if-no-files-found: error
      - name: Back up the edited plans
        if: success() && github.event.inputs.action == 'delete' && steps.seal.outputs.plans_sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-plans
          path: data/sealed/plans.enc
          retention-days: 90
          if-no-files-found: error
      # The fresh copies above are now the newest, so every restore picks them.
      # The older entries still hold the deleted rows (encrypted, but held)
      # until GitHub evicts them (7 days unused) or they expire (90 days);
      # delete them now rather than wait. The pre-sealing `registry-`/`plans-`
      # caches, if any were ever made, are plain text and all go.
      - name: Delete the older caches and backups that still hold the rows
        if: success() && github.event.inputs.action == 'delete'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for prefix in sealed-registry- sealed-plans-; do
            gh cache list --key "$prefix" --limit 100 --json key --jq '.[].key' |
              grep -v -x "${prefix}${GITHUB_RUN_ID}" |
              while read -r key; do gh cache delete "$key"; done
          done
          for prefix in registry- plans-; do
            gh cache list --key "$prefix" --limit 100 --json key --jq '.[].key' |
              while read -r key; do gh cache delete "$key"; done
          done
          .venv/bin/python -m run.statebox prune registry plans --keep-run "$GITHUB_RUN_ID"
      # The only step handed a token that can push (the credential helper reads
      # it from this step's environment; .git/config never holds it).
      - name: Commit the stop list and the forgotten-customer list
        if: success() && github.event.inputs.action == 'delete'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          [ -f data/processed/suppressed.txt ] && git add data/processed/suppressed.txt || true
          [ -f data/processed/forgotten.txt ] && git add -f data/processed/forgotten.txt || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Privacy request: deletion applied"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
