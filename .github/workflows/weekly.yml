# Tuesday weekly pipeline (PLAN.md season ops: reports generate Tue morning).
#
# This drives the ROSTER product (PLAN §0): payments become subscribers via
# run.intake, and run.tuesday builds and mails one report per typed roster. No
# league platform is read anywhere in this job, and that is enforced in the
# suite by import reachability, not by this comment
# (test_the_roster_runner_cannot_reach_sleeper_at_all).
#
# There is no "my own report" step any more. run.week needs a league id and a
# roster id; the owner gets a report the same way every subscriber does, by
# being a row in data/registry/rosters.json.
#
# Secrets that matter here:
#   STRIPE_API_KEY        — restricted, read access to subscriptions+customers
#   STRIPE_PAYMENT_LINKS  — s:plink_A,m:plink_B,p:plink_C (the plan is a FACT)
#   EMAIL_PROVIDER + that provider's key — unset means dry-run, which FAILS the
#                           job rather than silently mailing nobody.

name: weekly-report

on:
  schedule:
    # Tuesdays 11:00 UTC. That is 07:00 ET while US daylight time is in effect
    # and 06:00 ET from Nov 1 2026, when it ends — cron has no timezone, so the
    # back half of the season sends an hour earlier than the front half.
    # Harmless for correctness (week resolution is date-based, never hour-based)
    # but it is a real change to when a subscriber's inbox lights up.
    - cron: "0 11 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write   # commit the record (ledger, send log, player directory) back
  issues: write     # raise an issue when a run fails, so it is never silent

jobs:
  week:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 because this job COMMITS BACK. The default is a
      # shallow clone, and `git pull --rebase` against a shallow history
      # can fail — which would break the persist step whose whole job is
      # keeping the record safe.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt
      # The ledger and the send log arrive WITH the checkout — they are
      # committed. The registry holds subscriber emails, so it is gitignored and
      # has to be restored, or the send step has nothing to send and silently
      # skips itself.
      #
      # Losing this cache is only PARTLY self-healing: a missing watermark makes
      # the next run sweep every session, but run.intake never reads back the
      # byl_roster_ref it stamps on the Stripe customer, so a subscriber whose
      # Checkout Session has aged out of Stripe's listing is unrecoverable.
      # GitHub evicts caches after 7 days without access and this cron touches
      # it on exactly a 7-day cycle, so one skipped week is the whole margin.
      - name: Restore subscriber registry
        uses: actions/cache/restore@v4
        with:
          path: data/registry
          key: registry-${{ github.run_id }}
          restore-keys: registry-
      # The nflverse download cache. Both run.intake and run.tuesday call
      # load_week_data, so without this one cron run downloads ~30 MB twice.
      - name: Restore nflverse cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      # The picker downloads site/join/players.json. Nothing regenerated it, and
      # a stale copy does not break a build — it breaks one specific customer's
      # signup, weeks later, surfacing only as a BLOCKED line in the intake log.
      # The season is derived rather than hardcoded: the Makefile's SEASON goes
      # stale every September.
      - name: Refresh the published player directory
        id: directory
        run: |
          SEASON=$(.venv/bin/python -c "from pathlib import Path; \
            from run.solo import current_season; \
            print(current_season(Path('data/raw/nflverse')))")
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          .venv/bin/python -m render.player_index --season "$SEASON"
      # Turn payments into the registry BEFORE building anything. With
      # STRIPE_API_KEY unset this exits 1 and changes nothing, so enabling it is
      # a secret, not a deploy.
      #
      # continue-on-error, and its limit: a sync that cannot reach Stripe must
      # not stop last week's known-good registry from being delivered. But
      # run.intake also exits 1 when a paid signup is BLOCKED — a customer who
      # paid and cannot be served — and swallowing that would be a green run
      # with a buried log line. So the send proceeds either way and the job is
      # failed afterwards, below, once everybody who COULD be mailed has been.
      - name: Turn payments into subscribers
        id: intake
        if: always()
        continue-on-error: true
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_PAYMENT_LINKS: ${{ secrets.STRIPE_PAYMENT_LINKS }}
          # Welcome emails ride the sweep (idempotent — the daily cron usually
          # got there first, and sent.jsonl means nobody is welcomed twice).
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BILLING_PORTAL_URL: ${{ secrets.BILLING_PORTAL_URL }}
          # The form backend (League Pass seats + self-serve roster updates)
          # and the secret that authenticates an update. All three unset means
          # neither feature delivers — never that either delivers unverified.
          FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
          FORM_API_KEY: ${{ secrets.FORM_API_KEY }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
        run: |
          set +e
          .venv/bin/python -m run.intake
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      # `if: always()` so a failed intake cannot hold up a paying subscriber's
      # report. EMAIL_PROVIDER unset means dry-run, and run.tuesday then prints
      # NOTHING WAS SENT and exits 1 rather than reporting a green success with
      # empty inboxes — so this step is safe to enable now and starts mailing
      # the day the secret is added, with no code change.
      - name: Send subscriber reports
        if: always()
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          # The roster-update link in every report needs both; with either
          # missing no link renders, which beats a dead one.
          SITE_URL: ${{ secrets.SITE_URL }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
        run: .venv/bin/python -m run.tuesday
      - name: Save subscriber registry
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/registry
          key: registry-${{ github.run_id }}
      - name: Save nflverse cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
      # Persist what cannot be rebuilt. `always()` so a failed send still records
      # who WAS mailed — the alternative is double-sending them on the retry.
      # Rebase before pushing: Monday's run commits too.
      - name: Persist the record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/processed/ledger site/join/players.json
          [ -f data/processed/sent.jsonl ] && git add data/processed/sent.jsonl || true
          git diff --cached --quiet && echo "nothing to persist" && exit 0
          git commit -m "Weekly run: ledger, send log, player directory"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports
          # reports/subscribers/ and reports/outbox/ are EXCLUDED deliberately.
          # They hold real subscriber addresses and their personalised reports;
          # a workflow artifact is downloadable by anyone who can read the repo's
          # Actions tab, so uploading reports/ wholesale would publish exactly
          # the data this project promises to keep off every public surface.
          path: |
            reports/
            !reports/subscribers/
            !reports/outbox/
            data/processed/ledger/
            # sent.jsonl is committed by the persist step, but that push is its
            # ONLY copy — and if the push fails after a successful send, the
            # next run has no record of who was mailed and sends to everyone
            # again. In the artifact it is at least recoverable by hand.
            data/processed/sent.jsonl
          if-no-files-found: error
      # AFTER delivery, not before. A blocked signup is somebody who paid and is
      # getting nothing, so the run must go red — but only once every subscriber
      # who could be served has been.
      # Exit 1 only: a paid signup that cannot be served, or a Stripe read that
      # failed. Exit 2 means STRIPE_API_KEY is simply unset, which is the
      # expected state until checkout opens — failing on that would file a bug
      # issue every single week and teach us to ignore the real one.
      - name: Fail the run if a paid signup could not be served
        if: always() && steps.intake.outputs.code == '1'
        run: |
          echo "run.intake exited 1 — a paid signup was blocked, or Stripe could"
          echo "not be read. Reports were still built and sent for everyone"
          echo "already in the registry. See the intake step's log."
          exit 1
      # A silent failure costs a paying subscriber their Tuesday and nobody
      # finds out until they complain. One issue per failed run, free.
      - name: Raise an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Weekly run failed: $(date -u +%Y-%m-%d)" \
            --body "The Tuesday pipeline failed. Subscribers may not have been mailed.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check in this order: nflverse releases reachable, STRIPE_API_KEY valid,
          any BLOCKED line in the intake log (a paid roster naming a player the
          directory does not have), email provider credentials, then whether
          data/processed/sent.jsonl shows a partial send." \
            --label bug || true
