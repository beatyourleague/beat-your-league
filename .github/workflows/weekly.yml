# Tuesday weekly pipeline (PLAN.md season ops: reports generate Tue morning).
# Activates once this repo is pushed to GitHub with the two secrets set:
#   SLEEPER_LEAGUE_ID  — the league to report on
#   SLEEPER_ROSTER_ID  — my roster id in that league
# The runner starts with an empty cache, so each run is one real pull against
# Sleeper (~80 throttled requests); reports upload as workflow artifacts.
# Nothing is committed back — data/ stays out of git by design.

name: weekly-report

on:
  schedule:
    - cron: "0 11 * * 2" # Tuesdays 11:00 UTC (7am ET)
  workflow_dispatch: {}

permissions:
  contents: write   # commit the record (availability, ledger, send log) back
  issues: write     # raise an issue when a run fails, so it is never silent

jobs:
  week:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 because this job COMMITS BACK. The default is a
      # shallow clone, and `git pull --rebase` against a shallow history
      # can fail — which would break the persist step whose whole job is
      # keeping the record safe.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt
      # Availability snapshots, the ledger and the send log now arrive WITH the
      # checkout — they are committed to the repo. They used to live only in an
      # Actions cache, which GitHub evicts after 7 days without access, and the
      # Tuesday run touched the send log on exactly a 7-day cycle: one delayed
      # run and the next would have mailed every paying subscriber twice.
      # The registry holds subscriber emails, so it is gitignored and cannot
      # arrive with the checkout — it has to be restored, or the send step below
      # has nothing to send and silently skips itself.
      - name: Restore subscriber registry
        uses: actions/cache/restore@v4
        with:
          path: data/registry
          key: registry-${{ github.run_id }}
          restore-keys: registry-
      - name: Run weekly pipeline (my own report)
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          SLEEPER_ROSTER_ID: ${{ secrets.SLEEPER_ROSTER_ID }}
        run: .venv/bin/python -m run.week
      # Subscriber delivery. EMAIL_PROVIDER is unset until the sending account
      # exists, and unset means dry-run — so this step is safe to enable now and
      # starts mailing the day the secret is added, with no code change.
      # STRIPE_API_KEY is the entitlement source: with it set, the run asks
      # Stripe who is currently paying and mails exactly those people, with no
      # export and no human step. A RESTRICTED key with read access to
      # subscriptions + customers is enough — never the full secret key.
      # Without it the run falls back to data/registry/substack-export.csv.
      # `if: always()` here and on the sync step, for a reason worth stating:
      # MY OWN report must never be able to hold up a paying subscriber's.
      # A step with no `if:` defaults to `if: success()`, so any non-zero exit
      # from `run.week` above — a missing league id, an ingest 5xx on my league,
      # a corrupt ledger — silently skipped the send for everybody, while the
      # subscriber batch was perfectly able to run. `always()` keeps the job red
      # and the failure issue firing; it just stops the blast radius at me.
      # (The old gate here was hashFiles('data/registry/subscribers.json'), a
      # path under the gitignored data/ that cannot exist on a fresh runner, so
      # this step skipped itself on every run and the cron had never mailed
      # anybody. run.batch already exits 0 with "registry is empty — nothing to
      # do", which is the correct place for that decision.)
      # Turn payments into a registry BEFORE building anything. With
      # STRIPE_API_KEY unset this is a no-op and the run falls back to whatever
      # registry the cache restored, so enabling it is a secret, not a deploy.
      # continue-on-error: a sync that cannot reach Stripe must not stop last
      # week's known-good registry from being delivered.
      - name: Sync signups from payments
        if: always()
        continue-on-error: true
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_PAYMENT_LINKS: ${{ secrets.STRIPE_PAYMENT_LINKS }}
          FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
          FORM_API_KEY: ${{ secrets.FORM_API_KEY }}
        run: .venv/bin/python -m run.sync
      - name: Send subscriber reports
        if: always()
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
        run: .venv/bin/python -m run.batch
      - name: Save subscriber registry
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/registry
          key: registry-${{ github.run_id }}
      # Persist the three things that cannot be rebuilt. `always()` so a failed
      # send still records who WAS mailed — the alternative is double-sending
      # them on the retry. Rebase before pushing: Monday's run commits too.
      - name: Persist the record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/raw/availability data/processed/ledger
          [ -f data/processed/sent.jsonl ] && git add data/processed/sent.jsonl || true
          git diff --cached --quiet && echo "nothing to persist" && exit 0
          git commit -m "Weekly run: availability, ledger, send log"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports
          # reports/subscribers/ and reports/outbox/ are EXCLUDED deliberately.
          # They hold real subscriber addresses and their personalised reports;
          # a workflow artifact is downloadable by anyone who can read the repo's
          # Actions tab, so uploading reports/ wholesale would publish exactly
          # the data this project promises to keep off every public surface.
          path: |
            reports/
            !reports/subscribers/
            !reports/outbox/
            data/processed/week_report.json
            data/raw/availability/
            data/processed/ledger/
          if-no-files-found: error
      # A silent failure costs a paying subscriber their Tuesday and nobody
      # finds out until they complain. One issue per failed run, free.
      - name: Raise an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Weekly run failed: $(date -u +%Y-%m-%d)" \
            --body "The Tuesday pipeline failed. Subscribers may not have been mailed.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check in this order: Sleeper reachable, STRIPE_API_KEY valid, email provider
          credentials, then whether data/processed/sent.jsonl shows a partial send." \
            --label bug || true
