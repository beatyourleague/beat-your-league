# Tuesday weekly pipeline (PLAN.md season ops: reports generate Tue morning).
#
# This drives the ROSTER product (PLAN §0): payments become subscribers via
# run.intake, and run.tuesday builds and mails one report per typed roster. No
# league platform is read anywhere in this job, and that is enforced in the
# suite by import reachability, not by this comment
# (test_the_roster_runner_cannot_reach_sleeper_at_all).
#
# There is no "my own report" step any more. run.week needs a league id and a
# roster id; the owner gets a report the same way every subscriber does, by
# being a row in data/registry/rosters.json.
#
# Secrets that matter here:
#   STRIPE_API_KEY        — restricted; its exact permissions are LAUNCH.md step 3
#   STRIPE_PAYMENT_LINKS  — s:plink_A,o:plink_B,p:plink_C in 2026 ($29, $19
#                           Playoff, $69; m: is monthly, from 2027) — the plan
#                           is a FACT about the link that took the money
#   EMAIL_PROVIDER + that provider's key — unset means dry-run, which FAILS the
#                           job rather than silently mailing nobody.
#   SENDER_POSTAL_ADDRESS — the sender line every commercial email carries;
#                           mapped into every step that can mail.

name: weekly-report

on:
  schedule:
    # Tuesdays 12:17 UTC — 08:17 ET on daylight time, 07:17 ET from Nov 1
    # 2026. Cron has no timezone, so the hour drifts by one across the season;
    # The 12 UTC hour was chosen over 11 so BOTH halves land at a civilised morning
    # hour instead of 06:00 ET in November. Minute :17, never :00 (OPS-01,
    # Oct 2026): the top of the hour is when GitHub's scheduler is busiest and
    # starts runs latest, and the Worker fires at the same minute.
    #
    # The floor is not taste, it is nflverse: Monday night's box scores have to
    # be published before a week-W report can project from a complete week W-1.
    # Their stats_player release was observed stamped 03:35 ET, so 08:00 gives
    # roughly four hours of margin after an overnight publish — and the ceiling
    # is that subscribers need the file with a full day before Wednesday waiver
    # processing. run/solo.py's assert_week_is_complete now refuses outright if
    # the week really is short, so a late publish is a loud failure and a
    # retry, never a quietly worse report.
    - cron: "17 12 * * 2"
    # THE SAME JOB AGAIN, four hours later. Not a second workflow: one
    # definition means the retry cannot drift from the thing it is retrying.
    #
    # If the 12:17 run worked, this costs nothing — every message carries an
    # idempotency key of (season, week, subscriber) checked against
    # data/processed/sent.jsonl, so it finds everyone already sent, reports
    # them as skipped, and exits clean. If the 12:17 run FAILED, subscribers
    # get their file the same morning instead of whenever the failure is
    # noticed, which for a solo operator could be Thursday.
    #
    # A missed week is far more likely and far more damaging than a duplicate
    # email, which is why this errs toward running twice. The one window it
    # cannot cover is a run that sent successfully and then failed to commit
    # sent.jsonl — the send log is uploaded as an artifact for exactly that
    # case, and recovering from it is deliberately manual.
    - cron: "17 16 * * 2"
  # The form Worker (infra/form-worker.js) also dispatches this at 12:17 and
  # 16:17 UTC on Tuesdays: GitHub's scheduler started these runs 5-7 hours
  # late on Oct 6 and Oct 13 2026. The crons above stay as the backup, and a
  # double trigger is safe — see the checkout step below.
  workflow_dispatch: {}

# One run at a time: two runs reading the same committed send log can mail the
# same message twice (the 14:17 UTC daily run fires from BOTH its crons at
# once; found by review, Sep 29 2026).
concurrency:
  group: weekly-report
  cancel-in-progress: false

# Nothing by default; the job below asks for exactly what it uses (INFRA-14).
permissions: {}

jobs:
  week:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # commit the record (ledger, send log, player directory) back
      issues: write     # raise an issue when a run fails, so it is never silent
      actions: read     # the sealed registry's and plans' backups, when the cache is gone
    steps:
      # fetch-depth: 0 because this job COMMITS BACK. The default is a
      # shallow clone, and `git pull --rebase` against a shallow history
      # can fail — which would break the persist step whose whole job is
      # keeping the record safe.
      # ref = the branch TIP, not the commit this run was triggered on. A run
      # queued behind another in the concurrency group would otherwise check
      # out the send log as it was when it was QUEUED — before the run ahead
      # of it pushed — and mail everything that run just mailed. (A double
      # trigger is routine now: the Worker's dispatch plus GitHub's backup.)
      #
      # Actions pinned to a full commit, tag in the comment (INFRA-06), and the
      # push token kept out of .git/config until the persist step (INFRA-07).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Hash-locked, runtime packages only (INFRA-07; requirements.lock).
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements.lock
      # The ledger and the send log arrive WITH the checkout — they are
      # committed. The registry holds subscriber emails, so it is gitignored and
      # has to be restored, or the send step has nothing to send and silently
      # skips itself.
      #
      # Losing this cache is only PARTLY self-healing: a missing watermark makes
      # the next run sweep every session, but run.intake never reads back the
      # byl_roster_ref it stamps on the Stripe customer, so a subscriber whose
      # Checkout Session has aged out of Stripe's listing is unrecoverable.
      # GitHub evicts caches after 7 days without access and this cron touches
      # it on exactly a 7-day cycle, so one skipped week was the whole margin —
      # which is why every sealed save also leaves a backup artifact, and the
      # open step reaches for it on a cache miss (run/statebox.py RULE S3).
      #
      # SEALED (INFRA-02): only data/sealed/*.enc is cached or uploaded,
      # encrypted under CACHE_KEY, because a pull-request run can restore this
      # branch's caches. A file that fails its check fails the open step, and
      # every save below is gated on it.
      - name: Restore subscriber registry (sealed)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/registry.enc
          key: sealed-registry-${{ github.run_id }}
          restore-keys: sealed-registry-
      # The lineups each subscriber was sent, for Saturday's final check
      # (run/saturday.py). Their OWN key, never inside data/registry: the
      # hourly intake cron saves that cache constantly, and a save racing this
      # run's would drop the week's plans. Restored before the send so the
      # 16:17 retry — which writes no new plans when everything was already
      # sent — saves the 12:17 run's plans forward instead of an empty folder.
      - name: Restore sent lineups (sealed)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/plans.enc
          key: sealed-plans-${{ github.run_id }}
          restore-keys: sealed-plans-
      # `python -I -S run/statebox.py`, not the venv: this step holds the job's
      # token for the backup fallback, and -I -S loads no site-packages, so no
      # third-party package (or its .pth startup hook) runs beside it (INFRA-07).
      # ALLOW_EMPTY_REGISTRY: a repo variable set for ONE run to start a lost
      # registry fresh on purpose (LAUNCH.md); unset, a lost copy after anyone
      # was served is a red run, never a Stripe-only rebuild.
      - name: Open the registry and the sent lineups
        id: open
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          GH_TOKEN: ${{ github.token }}
          ALLOW_EMPTY_REGISTRY: ${{ vars.ALLOW_EMPTY_REGISTRY }}
        run: python -I -S run/statebox.py open registry plans --backup
      # The nflverse download cache. Both run.intake and run.tuesday call
      # load_week_data, so without this one cron run downloads ~30 MB twice.
      - name: Restore nflverse cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      # The picker downloads site/join/players.json. Nothing regenerated it, and
      # a stale copy does not break a build — it breaks one specific customer's
      # signup, weeks later, surfacing only as a BLOCKED line in the intake log.
      # The season is derived rather than hardcoded: the Makefile's SEASON goes
      # stale every September.
      # The bye planner's data (site/join/byes.json, and the season table on
      # site/byes/) is refreshed beside it, from the same directory. It refuses
      # to write a partial bye list, and a refusal is a warning, not a red run:
      # last week's dated file is right about every bye and says how old its
      # reserve list is.
      - name: Refresh the published player directory
        id: directory
        run: |
          SEASON=$(.venv/bin/python -c "from pathlib import Path; \
            from run.solo import current_season; \
            print(current_season(Path('data/raw/nflverse')))")
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          .venv/bin/python -m render.player_index --season "$SEASON"
          .venv/bin/python -m render.bye_index --season "$SEASON" || echo "::warning::bye planner data not refreshed; last week's stays"
      # Turn payments into the registry BEFORE building anything. With
      # STRIPE_API_KEY unset this exits 1 and changes nothing, so enabling it is
      # a secret, not a deploy.
      #
      # continue-on-error, and its limit: a sync that cannot reach Stripe must
      # not stop last week's known-good registry from being delivered. But
      # run.intake also exits 1 when a paid signup is BLOCKED — a customer who
      # paid and cannot be served — and swallowing that would be a green run
      # with a buried log line. So the send proceeds either way and the job is
      # failed afterwards, below, once everybody who COULD be mailed has been.
      #
      # --no-mail, and no email secrets at all: this intake writes the registry
      # and mails NOBODY. Welcomes, roster-update confirmations and first
      # reports go from daily.yml's intake only. The two workflows sit in
      # different concurrency groups and each reads the send log from its own
      # checkout, so when GitHub's late backup of this run landed beside an
      # hourly daily run, both mailed the same new buyer a welcome and a first
      # report (reproduced, launch review OPS-6, Oct 2026). The daily run's
      # next half-hour sends whatever this one leaves.
      #
      # Never after a failed open (wrong CACHE_KEY, a file that failed its
      # check, GitHub down mid-restore): data/registry is then EMPTY, and a
      # full Stripe sweep would write a Stripe-only registry with no seat log
      # and no roster changes — and the send below would mail every payer a
      # report on their signup roster, logged as sent, so the right one never
      # goes. The open's failure already turns the run red and files the issue.
      - name: Turn payments into subscribers
        id: intake
        if: always() && steps.open.outcome == 'success'
        continue-on-error: true
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_PAYMENT_LINKS: ${{ secrets.STRIPE_PAYMENT_LINKS }}
          # The form backend (League Pass seats + self-serve roster updates)
          # and the secret that authenticates an update. All three unset means
          # neither feature delivers — never that either delivers unverified.
          FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
          FORM_API_KEY: ${{ secrets.FORM_API_KEY }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
          # A rotated UPDATE_SECRET's old value (OPS-R10; run/updates.py).
          UPDATE_SECRET_PREVIOUS: ${{ secrets.UPDATE_SECRET_PREVIOUS }}
          # A game postponed or suspended that the schedule still shows at its
          # old kickoff (run/solo.py POSTPONED_GAMES, LAUNCH.md section 8): a repo
          # variable set for one week, AWAY@HOME. Unset excuses nothing.
          POSTPONED_GAMES: ${{ vars.POSTPONED_GAMES }}
        run: |
          set +e
          .venv/bin/python -m run.intake --no-mail
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      # `if: always()` so a failed intake cannot hold up a paying subscriber's
      # report. EMAIL_PROVIDER unset means dry-run, and run.tuesday then prints
      # NOTHING WAS SENT and exits 1 rather than reporting a green success with
      # empty inboxes — so this step is safe to enable now and starts mailing
      # the day the secret is added, with no code change. Before launch (no
      # registry file and no STRIPE_API_KEY) it exits 0 and says why: a red
      # run every Tuesday for a checkout that is not open is noise. Gated on
      # the open like the intake above: never a report off an empty registry.
      - name: Send subscriber reports
        if: always() && steps.open.outcome == 'success'
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          # Keys every address-derived send-log code and the stop-list check
          # (run/digest.py). Never rotated: rotating it orphans every code.
          LOG_SECRET: ${{ secrets.LOG_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          # The roster-update link in every report needs all three; with any
          # missing it renders the reply route instead, never a dead link.
          SITE_URL: ${{ secrets.SITE_URL }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
          FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
          # Every report's cancel link and its List-Unsubscribe header. Without
          # it both fell back to the terms page's cancel section — a page that
          # explains cancelling instead of the button that does it.
          BILLING_PORTAL_URL: ${{ secrets.BILLING_PORTAL_URL }}
          # The sender's postal address every commercial email must carry
          # (render/sender.py reads only the environment, so a secret no step
          # maps reaches no email).
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
          # A game postponed or suspended that the schedule still shows at its
          # old kickoff (run/solo.py POSTPONED_GAMES, LAUNCH.md section 8): a repo
          # variable set for one week, AWAY@HOME. Unset excuses nothing.
          POSTPONED_GAMES: ${{ vars.POSTPONED_GAMES }}
        run: .venv/bin/python -m run.tuesday
      # The live sample (render/live_sample.py): this week's report for the
      # published sample roster, so the site shows the product running now,
      # not a 2024 replay. Its FIRST build before the week's first kickoff
      # RECORDS the odds it prints on the public ledger (principle 2: a % in
      # public is a published call), committed below with the rest of the
      # ledger. Every later run of the week — the 16:17 retry, a late GitHub
      # backup — keeps that page (site/week.json says the week is recorded),
      # because games.csv and players.csv revalidate in between and a rebuild
      # could record a second set of calls (OPS-R3); after kickoff it changes
      # nothing. A data outage keeps the last page; a ledger it cannot write
      # fails the run rather than publishing odds off the record.
      - name: Publish this week's sample report
        if: always()
        env:
          # The same postponed-game excuse as the send above (LAUNCH.md
          # section 8): the sample builds the week the subscribers get.
          POSTPONED_GAMES: ${{ vars.POSTPONED_GAMES }}
        run: .venv/bin/python -m render.live_sample
      # The same report, as posts ready to paste (run/drops.py): one file,
      # overwritten each Tuesday, so the owner reads a single page on a phone.
      # Drafts only — nothing posts itself.
      - name: Draft this week's public posts
        if: always()
        run: .venv/bin/python -m run.drops
      # Sealed before they leave the runner (run/statebox.py RULE S1): without
      # CACHE_KEY this exits 1 once there is anything to seal.
      - name: Seal the registry and the sent lineups
        id: seal
        if: always() && steps.open.outcome == 'success'
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          STRIPE_KEY_SET: ${{ secrets.STRIPE_API_KEY != '' }}
        run: python -I -S run/statebox.py seal registry plans
      - name: Save subscriber registry (sealed)
        if: always() && steps.seal.outputs.registry_sealed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/registry.enc
          key: sealed-registry-${{ github.run_id }}
      - name: Save sent lineups (sealed)
        if: always() && steps.seal.outputs.plans_sealed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/plans.enc
          key: sealed-plans-${{ github.run_id }}
      # The durable copies (RULE S3), when this run changed them. The 16:17
      # retry that finds everyone already sent changes nothing and uploads
      # nothing; the daily run keeps the registry's copy fresh regardless.
      - name: Back up the sealed registry
        if: always() && steps.seal.outputs.registry_sealed == 'true' && steps.seal.outputs.registry_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-registry
          path: data/sealed/registry.enc
          retention-days: 90
          if-no-files-found: error
      - name: Back up the sealed lineups
        if: always() && steps.seal.outputs.plans_sealed == 'true' && steps.seal.outputs.plans_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-plans
          path: data/sealed/plans.enc
          retention-days: 90
          if-no-files-found: error
      - name: Save nflverse cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
      # The live sample's page is rebuilt above, so its inline script hashes
      # are re-derived before the commit: a stale site/_headers would block
      # that page's script once the site is served from Cloudflare Pages.
      - name: Refresh the security headers
        if: always()
        run: .venv/bin/python -m render.headers
      # Persist what cannot be rebuilt. `always()` so a failed send still records
      # who WAS mailed — the alternative is double-sending them on the retry.
      # Rebase before pushing: Monday's run commits too.
      #
      # The only step handed a token that can push: the credential helper reads
      # it from this step's environment, so .git/config never holds it.
      - name: Persist the record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          git add -A data/processed/ledger site/join/players.json site/this-week.html site/week.json site/_headers content/this-week.md site/join/byes.json site/byes/index.html
          [ -f data/processed/sent.jsonl ] && git add data/processed/sent.jsonl || true
          git diff --cached --quiet && echo "nothing to persist" && exit 0
          git commit -m "Weekly run: ledger, send log, player directory"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-reports
          # reports/subscribers/ and reports/outbox/ are EXCLUDED deliberately.
          # They hold real subscriber addresses and their personalised reports;
          # a workflow artifact is downloadable by anyone who can read the repo's
          # Actions tab, so uploading reports/ wholesale would publish exactly
          # the data this project promises to keep off every public surface.
          path: |
            reports/
            !reports/subscribers/
            !reports/outbox/
            data/processed/ledger/
            # sent.jsonl is committed by the persist step, but that push is its
            # ONLY copy — and if the push fails after a successful send, the
            # next run has no record of who was mailed and sends to everyone
            # again. In the artifact it is at least recoverable by hand.
            data/processed/sent.jsonl
          if-no-files-found: error
      # AFTER delivery, not before. A blocked signup is somebody who paid and is
      # getting nothing, so the run must go red — but only once every subscriber
      # who could be served has been.
      # Exit 1 only: a paid signup that cannot be served, or a Stripe read that
      # failed. Exit 2 means STRIPE_API_KEY is simply unset, which is the
      # expected state until checkout opens — failing on that would file a bug
      # issue every single week and teach us to ignore the real one.
      - name: Fail the run if a paid signup could not be served
        if: always() && steps.intake.outputs.code == '1'
        run: |
          echo "run.intake exited 1 — a paid signup was blocked, Stripe could not"
          echo "be read, or League Pass seat links match no pass (a rotated"
          echo "UPDATE_SECRET). Reports were still built and sent for everyone"
          echo "already in the registry. See the intake step's log."
          exit 1
      # A silent failure costs a paying subscriber their Tuesday and nobody
      # finds out until they complain.
      # ONE open issue per kind of failure: a later failure comments on the
      # open one instead of opening another (before launch these crons filed
      # 16 near-identical issues, which teaches exactly the wrong habit). The
      # title carries no date for that reason; each comment does. Listed, not
      # searched: the search index can lag a fresh issue by minutes.
      - name: Raise an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Weekly run failed
        run: |
          body="$(date -u +%Y-%m-%d): the Tuesday pipeline failed. Subscribers may not have been mailed.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Check in this order: nflverse releases reachable, STRIPE_API_KEY valid,
          CACHE_KEY set and unchanged (the open and seal steps), any BLOCKED line
          in the intake log (a paid roster naming a player the directory does not
          have), email provider credentials, then whether
          data/processed/sent.jsonl shows a partial send."
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty' || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --label bug \
              || gh issue create --title "$TITLE" --body "$body" || true
          fi

  # This week's share image (render/og.py --week): the recorded closest call
  # in site/week.json (contract C9), drawn as the preview X shows for
  # this-week.html, the page every Tuesday post links. Its OWN job, after the
  # one above: no secrets at all and no registry on disk, because it runs a
  # browser — the runner image's preinstalled Chrome (render.og.find_chrome
  # lists google-chrome) — on a page built from third-party data.
  #
  # It checks out the branch tip, so it starts from the persist push above.
  # A refusal (no recorded closest call, a toss-up, a figure the page does not
  # print) or a missing browser is a ::notice:: and exit 0: the page simply
  # keeps the site's own card, and an older week's card is deleted. pages.yml
  # redeploys when this workflow completes, this job included.
  share-card:
    needs: week
    if: always() && needs.week.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # commit the card and the page's preview tags
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Draw this week's share card
        run: .venv/bin/python -m render.og --week
      # Only the card and the page's preview tags: nothing else in this job
      # is ever committed.
      - name: Persist the card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          # An empty folder still matches the pathspec; a missing one would
          # fail the add on a week with no card.
          mkdir -p site/og
          git add -A site/og site/this-week.html
          git diff --cached --quiet && echo "nothing to persist" && exit 0
          git commit -m "Weekly run: this week's share card"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
