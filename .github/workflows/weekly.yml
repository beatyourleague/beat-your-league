# Tuesday weekly pipeline (PLAN.md season ops: reports generate Tue morning).
# Activates once this repo is pushed to GitHub with the two secrets set:
#   SLEEPER_LEAGUE_ID  — the league to report on
#   SLEEPER_ROSTER_ID  — my roster id in that league
# The runner starts with an empty cache, so each run is one real pull against
# Sleeper (~80 throttled requests); reports upload as workflow artifacts.
# Nothing is committed back — data/ stays out of git by design.

name: weekly-report

on:
  schedule:
    - cron: "0 11 * * 2" # Tuesdays 11:00 UTC (7am ET)
  workflow_dispatch: {}

jobs:
  week:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt
      # Availability snapshots are the one dataset that can only ever be
      # captured live (players table has no history) — they must survive
      # across ephemeral runners or the gating policy has nothing to stand on.
      - name: Restore availability snapshot archive
        uses: actions/cache/restore@v4
        with:
          path: data/raw/availability
          key: availability-archive-${{ github.run_id }}
          restore-keys: availability-archive-
      # The ledger is the public record: this run RECORDS calls, Monday's run
      # grades them. Both workflows share the ledger-archive- key family.
      - name: Restore ledger archive
        uses: actions/cache/restore@v4
        with:
          path: data/processed/ledger
          key: ledger-archive-${{ github.run_id }}
          restore-keys: ledger-archive-
      # Remembering who was already mailed is what stops a re-run from sending
      # Tuesday's report twice, so it has to survive the ephemeral runner.
      - name: Restore delivery log
        uses: actions/cache/restore@v4
        with:
          path: data/processed/sent.jsonl
          key: sent-log-${{ github.run_id }}
          restore-keys: sent-log-
      # The registry holds subscriber emails, so it is gitignored and cannot
      # arrive with the checkout — it has to be restored, or the send step below
      # has nothing to send and silently skips itself.
      - name: Restore subscriber registry
        uses: actions/cache/restore@v4
        with:
          path: data/registry
          key: registry-${{ github.run_id }}
          restore-keys: registry-
      - name: Run weekly pipeline (my own report)
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          SLEEPER_ROSTER_ID: ${{ secrets.SLEEPER_ROSTER_ID }}
        run: .venv/bin/python -m run.week
      # Subscriber delivery. EMAIL_PROVIDER is unset until the sending account
      # exists, and unset means dry-run — so this step is safe to enable now and
      # starts mailing the day the secret is added, with no code change.
      # STRIPE_API_KEY is the entitlement source: with it set, the run asks
      # Stripe who is currently paying and mails exactly those people, with no
      # export and no human step. A RESTRICTED key with read access to
      # subscriptions + customers is enough — never the full secret key.
      # Without it the run falls back to data/registry/substack-export.csv.
      # No `if:` guard here on purpose. It used to gate on
      # hashFiles('data/registry/subscribers.json'), which is a path under the
      # gitignored data/ — on a fresh runner that file could never exist, so
      # this step skipped itself on every single run and the cron has never
      # actually mailed anybody. run.batch already exits 0 with "registry is
      # empty — nothing to do" when there are no subscribers, which is the
      # correct place for that decision.
      # Turn payments into a registry BEFORE building anything. With
      # STRIPE_API_KEY unset this is a no-op and the run falls back to whatever
      # registry the cache restored, so enabling it is a secret, not a deploy.
      # continue-on-error: a sync that cannot reach Stripe must not stop last
      # week's known-good registry from being delivered.
      - name: Sync signups from payments
        continue-on-error: true
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_PAYMENT_LINKS: ${{ secrets.STRIPE_PAYMENT_LINKS }}
          FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
          FORM_API_KEY: ${{ secrets.FORM_API_KEY }}
        run: .venv/bin/python -m run.sync
      - name: Send subscriber reports
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
        run: .venv/bin/python -m run.batch
      - name: Save delivery log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/processed/sent.jsonl
          key: sent-log-${{ github.run_id }}
      - name: Save subscriber registry
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/registry
          key: registry-${{ github.run_id }}
      - name: Save availability snapshot archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/availability
          key: availability-archive-${{ github.run_id }}
      - name: Save ledger archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/processed/ledger
          key: ledger-archive-${{ github.run_id }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports
          # reports/subscribers/ and reports/outbox/ are EXCLUDED deliberately.
          # They hold real subscriber addresses and their personalised reports;
          # a workflow artifact is downloadable by anyone who can read the repo's
          # Actions tab, so uploading reports/ wholesale would publish exactly
          # the data this project promises to keep off every public surface.
          path: |
            reports/
            !reports/subscribers/
            !reports/outbox/
            data/processed/week_report.json
            data/raw/availability/
            data/processed/ledger/
          if-no-files-found: error
