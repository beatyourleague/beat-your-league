# Publishes site/ to GitHub Pages. This is the ONLY deploy mechanism — classic
# branch-based Pages cannot serve a subdirectory as the site root, and serving
# the repo root would publish PLAN.md and CLAUDE.md alongside the product.
#
# One-time setup after pushing: repo Settings -> Pages -> Source = "GitHub
# Actions". Nothing else.
#
# Triggers: any push that changes site/, a manual run, and the completion of
# the Monday grading cron — monday.yml commits the refreshed ledger with
# GITHUB_TOKEN, and pushes made with that token deliberately do NOT trigger
# on:push workflows, so without the workflow_run trigger the public ledger
# would go stale the moment it mattered.
#
# GitHub Pages ignores site/_headers (it cannot set response headers at all);
# that file takes effect when the site moves to Cloudflare Pages (LAUNCH.md,
# "The repo and the host"), and this workflow is retired then.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch: {}
  workflow_run:
    # BOTH crons, and these are literal strings matched by name. A push made
    # with GITHUB_TOKEN deliberately does not fire `on: push`, so the Tuesday
    # run's refreshed site/join/players.json — the directory the picker
    # downloads — reached the live site only when Monday happened to redeploy,
    # up to six days later. A stale directory blocks a paying customer's signup.
    workflows: [monday-receipts, weekly-report]
    types: [completed]

# Nothing by default; the job below asks for exactly what it uses (INFRA-14).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A workflow_run fired by a run from somebody else's fork never deploys
    # (the checkout resolves to this branch's tip anyway; this says so).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to full commits, tags in the comments (INFRA-06).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
