# The terms / privacy change notice (run/notice.py, D6).
#
# Both pages promise that a change which materially affects a subscriber is
# emailed to them BEFORE it takes effect. Run this once per change, after the
# new page is published and before its effective date: it mails every
# subscriber and seat entitled today, one notice per mailbox, keyed in the send
# log so a re-run sends nothing twice. Untick `send` for a dry run.
#
# A real send needs the owner's approval code (run/approval.py, INFRA-06),
# made on the owner's own machine for the exact page, date and summary:
#     make notice-approval PAGE=terms EFFECTIVE=2026-11-15    (then paste the summary)
# The form Worker's dispatch token can start this workflow; it cannot make
# that code, so it cannot mail every subscriber words of its own choosing.
name: change-notice

on:
  workflow_dispatch:
    inputs:
      page:
        description: "Which page changed"
        type: choice
        options: [terms, privacy]
      effective:
        description: "The date the change takes effect, YYYY-MM-DD (must be after today)"
        type: string
        required: true
      summary:
        description: "What changes, in one or two plain sentences (sent as written)"
        type: string
        required: true
      send:
        description: "Actually send (unticked = dry run)"
        type: boolean
        default: false
      approval:
        description: "For a real send: the code from `make notice-approval PAGE=... EFFECTIVE=...` on your machine (it asks for the summary)"
        type: string
        required: false
        default: ""

# The send log is shared with the daily sweep; one writer at a time.
concurrency:
  group: daily-intake
  cancel-in-progress: false

# Nothing by default; each job below asks for exactly what it uses (INFRA-14).
permissions: {}

# Two jobs (SEC-1, Oct 2026; weekly.yml says why at length): `notice` runs the
# pip-installed packages and pushes nothing, and `commit-record` pushes what it
# handed over from a runner that installs and runs nothing.
jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read    # the checkout; commit-record pushes the send log
      actions: read     # the sealed registry's backup, when the cache is gone
    outputs:
      # The commit this job started from, as the checkout action itself reports
      # it (fixed before any step of ours runs), and whether the hand-off below
      # found anything to persist. Its commit job reads both (SEC-1).
      base: ${{ steps.checkout.outputs.commit }}
      staged: ${{ steps.handoff.outputs.staged }}
    steps:
      # Actions pinned to a full commit, tag in the comment (INFRA-06), and no
      # token left in .git/config (INFRA-07) — this job has none that can push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Hash-locked, runtime packages only (INFRA-07; requirements.lock).
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Restore subscriber registry (sealed)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/registry.enc
          key: sealed-registry-${{ github.run_id }}
          restore-keys: sealed-registry-
      # `python -I -S run/statebox.py`, not the venv: this step holds the job's
      # token for the backup fallback, and -I -S loads no site-packages, so no
      # third-party package (or its .pth startup hook) runs beside it (INFRA-07).
      # ALLOW_EMPTY_REGISTRY: a repo variable set for ONE run to start a lost
      # registry fresh on purpose (LAUNCH.md); unset, a lost copy after anyone
      # was served is a red run, never a Stripe-only rebuild.
      - name: Open the registry
        id: open
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          GH_TOKEN: ${{ github.token }}
          ALLOW_EMPTY_REGISTRY: ${{ vars.ALLOW_EMPTY_REGISTRY }}
        run: python -I -S run/statebox.py open registry --backup
      # Before a single message is built: the owner's code for these exact
      # words. A dry run needs none — it mails nobody.
      - name: Check the owner's approval
        if: github.event.inputs.send == 'true'
        env:
          PAGE: ${{ github.event.inputs.page }}
          EFFECTIVE: ${{ github.event.inputs.effective }}
          SUMMARY: ${{ github.event.inputs.summary }}
          APPROVAL: ${{ github.event.inputs.approval }}
          LOG_SECRET: ${{ secrets.LOG_SECRET }}
        run: .venv/bin/python -m run.approval verify notice "$APPROVAL" "$PAGE" "$EFFECTIVE" "$SUMMARY"
      - name: Send the notice
        env:
          PAGE: ${{ github.event.inputs.page }}
          EFFECTIVE: ${{ github.event.inputs.effective }}
          SUMMARY: ${{ github.event.inputs.summary }}
          SEND: ${{ github.event.inputs.send }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          LOG_SECRET: ${{ secrets.LOG_SECRET }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BILLING_PORTAL_URL: ${{ secrets.BILLING_PORTAL_URL }}
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
        run: |
          .venv/bin/python -m run.notice --page "$PAGE" --effective "$EFFECTIVE" \
            --summary "$SUMMARY" $([ "$SEND" = "true" ] && echo --send)
      # The send log, handed to commit-record, which pushes it from a runner
      # nothing here has touched. `always()`: a notice that failed part-way
      # still records who WAS mailed, so a re-run never mails them twice.
      - name: Hand the record to its commit job
        id: handoff
        if: always()
        env:
          RECORD_PATHS: data/processed/sent.jsonl
        run: |
          set -euo pipefail
          set -f
          stage="$RUNNER_TEMP/record"
          rm -rf "$stage"
          mkdir -p "$stage"
          git ls-files -z --cached --others --exclude-standard -- $RECORD_PATHS |
            while IFS= read -r -d '' path; do
              case "/$path" in */.git*) continue ;; esac
              [ -f "$path" ] && [ ! -L "$path" ] || continue
              mkdir -p "$stage/$(dirname "$path")"
              cp "$path" "$stage/$path"
            done
          if [ -n "$(find "$stage" -type f -print -quit)" ]; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing at the record's paths to hand over"
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi
      # overwrite: a re-run of this job replaces the record its first attempt
      # left, rather than failing on the name and persisting nothing.
      - name: Upload the record
        if: always() && steps.handoff.outputs.staged == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notice-record
          path: ${{ runner.temp }}/record/
          if-no-files-found: error
          overwrite: true


  # The send log, pushed from a runner that installs nothing and runs nothing
  # but git and the shell (SEC-1): the artifact must hold the send log and
  # nothing else, and is laid on the commit `notice` started from and rebased,
  # so another cron's lines pushed in between are merged (merge=union), never
  # overwritten. `always()`, as the persist step it replaces had: a failed
  # send still records who WAS mailed. Skipped only when there is no send log
  # yet (before launch), where the old step had nothing to add.
  commit-record:
    needs: notice
    if: always() && needs.notice.outputs.staged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the record; nothing else
    steps:
      # fetch-depth: 0: the starting commit is checked against this branch's
      # history, and `git pull --rebase` against a shallow history can fail.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      # Outside the checkout: nothing in it reaches the work tree until the
      # check below has passed it.
      - name: Download the record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notice-record
          path: ${{ runner.temp }}/record
      - name: Check the record and lay it on the notice job's commit
        env:
          BASE: ${{ needs.notice.outputs.base }}
          RECORD_ALLOWED: /data/processed/sent.jsonl
        run: |
          set -euo pipefail
          set -f
          record="$RUNNER_TEMP/record"
          # The starting commit must be on this branch: rebasing from anywhere
          # else would push whatever lies between it and here.
          if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$BASE" HEAD; then
            echo "::error::the starting commit is not on this branch; nothing was persisted"
            exit 1
          fi
          odd=$(find "$record" -mindepth 1 ! -type f ! -type d -print -quit)
          if [ -n "$odd" ]; then
            echo "::error::the artifact holds something that is not a plain file; nothing was persisted"
            exit 1
          fi
          files=()
          while IFS= read -r -d '' file; do
            path=${file#"$record"/}
            ok=
            case "/$path" in
              */.git*) ;;
              *) for allowed in $RECORD_ALLOWED; do
                   case "/$path" in $allowed) ok=1 ;; esac
                 done ;;
            esac
            if [ -z "$ok" ]; then
              printf '::error::the artifact holds %q, which this job never commits; nothing was persisted\n' "$path"
              exit 1
            fi
            files+=("$path")
          done < <(find "$record" -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the artifact is empty; nothing was persisted"
            exit 1
          fi
          git reset -q --hard "$BASE"
          for folder in ${RECORD_REPLACES:-}; do
            rm -rf "$folder"
          done
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            cp "$record/$path" "$path"
          done
          echo "${#files[@]} file(s) laid on $BASE"
      # The only step handed a token that can push (the credential helper reads
      # it from this step's environment; .git/config never holds it).
      - name: Persist the send log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SEC-1: no hook or fsmonitor command an earlier step left in .git (or
          # in any git config file) runs beside the token: config given on the
          # command line outranks them all, for every git call below.
          git() { command git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          [ -f data/processed/sent.jsonl ] && git add data/processed/sent.jsonl || true
          git diff --cached --quiet && echo "nothing to persist" && exit 0
          git commit -m "Change notice: send log"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
