# Daily signup sweep. Two jobs the weekly cadence is too slow for:
#
#   1. The welcome email. It is the legally-owed acknowledgment (renewal terms
#      + how to cancel), and a buyer who purchases Wednesday must not wait six
#      days for it. Idempotent through data/processed/sent.jsonl, so the
#      Tuesday run re-attempting the same welcomes sends nothing twice.
#   2. The BLOCKED alarm. A paid roster naming a player the directory does not
#      have is somebody paying for nothing; discovering that within a day
#      instead of a week is the difference between a quick fix and a refund.
#
# The once-a-day run (14:17) also checks the OTHER crons happened at all
# (run/watchdog.py): a run GitHub never starts files nothing on its own.
#
# The weekly reports are Tuesday's job; the only reports built here are the
# free one and the one a purchase earns, each with its own guards. The name is
# load-bearing the same way monday-receipts is NOT: pages.yml does not watch
# this workflow, because it never touches site/.

name: daily-intake

on:
  schedule:
    # 14:17 UTC daily — mid-morning US either side of the DST change.
    - cron: "17 14 * * *"
    # AND every hour. A purchase is the moment a subscriber is most engaged and
    # least patient: buying on Wednesday and holding nothing until Thursday
    # afternoon is the "I paid and got nothing" gap that drives refunds at this
    # size, and during draft season they are actively working on the team they
    # just paid you to analyse.
    #
    # Safe to run hourly for the same reason the Tuesday retry is safe: every
    # message carries an idempotency key checked against sent.jsonl, so a run
    # with no new payments finds nothing to do and mails nobody. The 14:17 run
    # above is the one that also sends renewal notices and drafts the reply
    # kit; those steps are cheap and idempotent too.
    #
    # This is the interim. Once the form Worker is deployed, a Stripe webhook
    # can trigger this workflow directly and the wait drops from an hour to a
    # minute — same pipeline, better trigger.
    #
    # Half an hour from the others (Oct 9 2026): at the same minute it fired
    # together with the Tuesday runs and the Saturday check, each in its own
    # concurrency group and each reading the send log from its own checkout,
    # so a purchase in that window could be welcomed or mailed twice. And off
    # the top of the hour (OPS-01, Oct 15 2026): every cron here sits at :17
    # or :47, because :00 is when GitHub's scheduler is busiest and latest.
    - cron: "47 * * * *"
  # The form Worker (infra/form-worker.js) dispatches this workflow on the
  # same two schedules, because GitHub's own scheduler ran 5-7 hours late and
  # dropped most hourly runs in October 2026; the crons above are the backup.
  # A dispatch carries no `github.event.schedule`, so `daily` says which of
  # the two it is: "true" only on the 14:17 dispatch. The default is false on
  # purpose — a dispatch that forgets the input must never walk every Stripe
  # subscription 24 times a day. Tick it to run the once-a-day steps by hand.
  workflow_dispatch:
    inputs:
      daily:
        description: "Also run the once-a-day steps (end-of-season billing stop, missed-run watchdog)"
        type: boolean
        default: false
      # The only way to clear a remembered payment alarm once the owner has
      # dealt with it: the memory lives in the sealed registry, out of reach of
      # a local run. Default false, and the Worker's dispatch never sends it.
      clear_unresolved:
        description: "Forget the payments already dealt with (PAID-UNATTRIBUTED, PLAYOFF-EARLY) — only once every one the log lists is handled"
        type: boolean
        default: false

# One run at a time: two runs reading the same committed send log can mail the
# same message twice (the 14:17 UTC daily run fires from BOTH its crons at
# once; found by review, Sep 29 2026).
concurrency:
  group: daily-intake
  cancel-in-progress: false

# Nothing by default; each job below asks for exactly what it uses (INFRA-14).
permissions: {}

# Three jobs (SEC-1, Oct 2026; weekly.yml says why at length): `intake` runs the
# pip-installed packages and pushes nothing, `commit-record` pushes the send
# log and the ledger it handed over from a runner that installs and runs
# nothing, and `file-issue` raises the sweep's issue when that push fails (the
# sweep's own failures are raised inside it, beside the watchdog's).
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read    # the checkout; commit-record pushes the send log
      issues: write     # the sweep's own failure and the watchdog's alarm
      actions: read     # the sealed registry's backup, when the cache is gone
    outputs:
      # The commit this job started from, as the checkout action itself reports
      # it (fixed before any step of ours runs), and whether the hand-off below
      # found anything to persist. Its commit job reads both (SEC-1).
      base: ${{ steps.checkout.outputs.commit }}
      staged: ${{ steps.handoff.outputs.staged }}
    steps:
      # ref = the branch TIP, not the commit this run was triggered on. A run
      # queued behind another in the concurrency group would otherwise check
      # out the send log as it was when it was QUEUED — before the run ahead
      # of it pushed — and mail everything that run just mailed. (A double
      # trigger is routine now: the Worker's dispatch plus GitHub's backup.)
      #
      # Every action is pinned to a full commit, its tag in the comment
      # (INFRA-06): a moved tag cannot change what runs beside the live keys.
      # persist-credentials: false leaves no token in .git/config (INFRA-07),
      # and this job holds none that can push: commit-record does.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Hash-locked (INFRA-07): every package, transitive ones included, must
      # match a hash in requirements.lock or nothing installs — and only the
      # runtime set: pytest and PyYAML never sit beside the live secrets.
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements.lock
      # The registry travels SEALED (run/statebox.py, INFRA-02): the cache and
      # the backup artifact hold only data/sealed/registry.enc, encrypted under
      # CACHE_KEY, because a pull-request run can restore this branch's caches.
      # A cache miss falls back to the newest backup; a file that fails its
      # check, or a GitHub outage mid-restore, fails this step, and every save
      # below is gated on it, so a bad restore never overwrites a good copy.
      - name: Restore subscriber registry (sealed)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/registry.enc
          key: sealed-registry-${{ github.run_id }}
          restore-keys: sealed-registry-
      # `python -I -S run/statebox.py`, not the venv: this step holds the job's
      # token for the backup fallback, and -I -S loads no site-packages, so no
      # third-party package (or its .pth startup hook) runs beside it (INFRA-07).
      # ALLOW_EMPTY_REGISTRY: a repo variable set for ONE run to start a lost
      # registry fresh on purpose (LAUNCH.md); unset, a lost copy after anyone
      # was served is a red run, never a Stripe-only rebuild.
      - name: Open the registry
        id: open
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          GH_TOKEN: ${{ github.token }}
          ALLOW_EMPTY_REGISTRY: ${{ vars.ALLOW_EMPTY_REGISTRY }}
        run: python -I -S run/statebox.py open registry --backup
      - name: Restore nflverse cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      # Exit 2 = STRIPE_API_KEY unset, the expected state until checkout opens;
      # exit 1 = a paid signup is blocked or Stripe unreadable. Same contract
      # as the weekly cron, for the same reason: a bug issue filed every day
      # for an unopened checkout teaches you to ignore bug issues.
      - name: Sweep signups and send welcomes
        id: intake
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_PAYMENT_LINKS: ${{ secrets.STRIPE_PAYMENT_LINKS }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          # Keys every address-derived send-log code and the stop-list check
          # (run/digest.py). Never rotated: rotating it orphans every code.
          LOG_SECRET: ${{ secrets.LOG_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Full access, read only by the bounce check (run/delivery.py):
          # the sending key cannot read a sent email back. Optional.
          RESEND_READ_KEY: ${{ secrets.RESEND_READ_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BILLING_PORTAL_URL: ${{ secrets.BILLING_PORTAL_URL }}
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
          FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
          FORM_API_KEY: ${{ secrets.FORM_API_KEY }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
          # A rotated UPDATE_SECRET's old value, comma-separated: seat links
          # already sent are still matched while it is set (OPS-R10).
          UPDATE_SECRET_PREVIOUS: ${{ secrets.UPDATE_SECRET_PREVIOUS }}
          # Spare daily sends to keep in hand: a repo variable, for when the
          # email plan's daily cap changes (unset = the code's own default).
          EMAIL_DAILY_HEADROOM: ${{ vars.EMAIL_DAILY_HEADROOM }}
          # A game postponed or suspended that the schedule still shows at its
          # old kickoff (run/solo.py POSTPONED_GAMES, LAUNCH.md section 8): a repo
          # variable set for one week, AWAY@HOME. Unset excuses nothing.
          POSTPONED_GAMES: ${{ vars.POSTPONED_GAMES }}
          # "true" only when the owner ticks the dispatch box below, after
          # dealing with every payment the run keeps reporting (PAID-UNATTRIBUTED,
          # PLAYOFF-EARLY; LAUNCH.md section 8). A scheduled run has no inputs,
          # so this is "false" and nothing is forgotten.
          CLEAR_UNRESOLVED: ${{ inputs.clear_unresolved == true }}
        run: |
          set +e
          if [ "$CLEAR_UNRESOLVED" = "true" ]; then
            .venv/bin/python -m run.intake --clear-unresolved
          else
            .venv/bin/python -m run.intake
          fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      # The free first report (run/trials.py): one per person per season, this
      # week's report for the roster they sent, recording nothing. Hourly is
      # the point — a free report that lands the next day loses the moment.
      # Reads the form Worker; with FORM_ENDPOINT unset, or nothing pending, it
      # sends nothing and exits 0. Requests waiting while EMAIL_PROVIDER is
      # unset exit 1 (OPS-08): the page promised them a report within the hour.
      #
      # STRIPE_API_KEY is load-bearing here though nothing is billed: it is
      # how run.trials tells "before launch" (no registry and no key, so nobody
      # can be a subscriber) from "the registry is missing" (fail closed, or
      # every subscriber reads as eligible for a free report).
      # Never after a failed open: an empty registry would make every
      # subscriber look like a stranger owed a free report.
      - name: Send free reports
        if: always() && steps.open.outcome == 'success'
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          # Keys every address-derived send-log code and the stop-list check
          # (run/digest.py). Never rotated: rotating it orphans every code.
          LOG_SECRET: ${{ secrets.LOG_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BILLING_PORTAL_URL: ${{ secrets.BILLING_PORTAL_URL }}
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
          FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT }}
          FORM_API_KEY: ${{ secrets.FORM_API_KEY }}
          # The day's hold on optional mail (run/intake.py DAY_HEADROOM, 60 on
          # the free email tier). run.trials applies it too, so without this the
          # repo variable set for a paid plan (LAUNCH.md step 2) would still
          # hold free reports at 60 a day.
          EMAIL_DAILY_HEADROOM: ${{ vars.EMAIL_DAILY_HEADROOM }}
          # A free report builds this week's report, so the same postponed-game
          # excuse as the intake above (LAUNCH.md section 8).
          POSTPONED_GAMES: ${{ vars.POSTPONED_GAMES }}
        run: .venv/bin/python -m run.trials
      # The pre-renewal notice (Cal. B&P §17602(b) and a promise this site
      # makes in seven places). The window is 15-45 days wide, so a missed day
      # costs nothing and the send log makes a duplicate impossible. Runs even
      # if the sweep above failed: a Stripe hiccup during intake must not also
      # swallow somebody's legally-owed notice.
      - name: Send pre-renewal notices
        if: always()
        id: renewals
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          # Keys every address-derived send-log code and the stop-list check
          # (run/digest.py). Never rotated: rotating it orphans every code.
          LOG_SECRET: ${{ secrets.LOG_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BILLING_PORTAL_URL: ${{ secrets.BILLING_PORTAL_URL }}
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
        run: |
          set +e
          .venv/bin/python -m run.renewals --send
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # Stop monthly billing at the end of the season, which five surfaces
      # promise and nothing enforced. `if: always()` for the same reason the
      # renewal notice has it: a Stripe hiccup during intake must not swallow a
      # promise made above Stripe's own Pay button.
      #
      # ONCE A DAY, not hourly. This job carries two crons ("17 14 * * *" and
      # "47 * * * *") and no step is schedule-gated, so an ungated step here
      # would walk every subscription on the account 24 times a day to write
      # nothing. The stop dates do not move between hours. A DISPATCH has no
      # schedule to compare, so it runs these only when it says `daily`: the
      # Worker's 14:17 dispatch does, its hourly ones do not.
      #
      # And once a day means ONCE: the 14:17 run fires twice by design (the
      # Worker's dispatch and GitHub's own cron, which can land hours apart),
      # and both passed the gate above — two "a scheduled run did not happen"
      # comments a day and two Stripe walks (launch review OPS-7). The first
      # run claims the UTC day with a `run-daily-<date>` marker in the send log
      # (persisted below, and read by the second run, which checks out the
      # branch tip); the second sees it and skips. The claim carries the same
      # schedule gate, so an hourly run can never claim the day first. If the
      # claim itself fails it prints nothing, and the steps run anyway:
      # running twice is the nuisance, not running is the failure.
      - name: Claim today's once-a-day steps
        if: always() && github.event.schedule != '47 * * * *' && (github.event_name != 'workflow_dispatch' || github.event.inputs.daily == 'true')
        id: today
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: .venv/bin/python -m run.watchdog --claim-day >> "$GITHUB_OUTPUT" || true

      - name: Stop monthly billing at the end of the season
        if: always() && steps.today.outputs.due != 'false' && github.event.schedule != '47 * * * *' && (github.event_name != 'workflow_dispatch' || github.event.inputs.daily == 'true')
        id: billing
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          set +e
          .venv/bin/python -m run.billing --send
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # The dead-man's switch (run/watchdog.py). A scheduled run GitHub never
      # started fails nothing and so files nothing, and the Saturday check
      # mails only on change, so its silence reads as "fine". From the
      # Wednesday after a send Tuesday this goes red if no Tuesday run for that
      # week left its marker; from the Sunday, if the final check left none —
      # but only when somebody who bought before the run was due was owed it.
      # Quiet before launch and with an empty registry. Once a day (claimed
      # above): an hourly alarm about the same missed Tuesday is 24 comments.
      - name: Check this week's scheduled runs happened
        if: always() && steps.today.outputs.due != 'false' && github.event.schedule != '47 * * * *' && (github.event_name != 'workflow_dispatch' || github.event.inputs.daily == 'true')
        id: watchdog
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          set +e
          .venv/bin/python -m run.watchdog > "$RUNNER_TEMP/watchdog.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/watchdog.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # The reply kit: the day's defensible numbers, all of them from the
      # public record. Cheap, deterministic, and the one growth channel that
      # runs without the owner writing anything from scratch.
      - name: Draft the daily reply kit
        if: always()
        run: .venv/bin/python -m run.posts replykit

      # Sealed before it leaves the runner, never in plain text: without
      # CACHE_KEY this exits 1 once there is anything to seal (before launch,
      # with no Stripe key either, it caches nothing and says so).
      - name: Seal the registry
        id: seal
        if: always() && steps.open.outcome == 'success'
        env:
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
          STRIPE_KEY_SET: ${{ secrets.STRIPE_API_KEY != '' }}
        run: python -I -S run/statebox.py seal registry
      - name: Save subscriber registry (sealed)
        if: always() && steps.seal.outputs.registry_sealed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sealed/registry.enc
          key: sealed-registry-${{ github.run_id }}
      # The durable copy (RULE S3): a cache entry is evicted after 7 days
      # unused, and seat-log.jsonl cannot be rebuilt from Stripe. Uploaded when
      # this run changed something, and by the once-a-day run regardless, so a
      # quiet offseason still keeps a copy younger than 90 days. "The once-a-day
      # run" is read off the claim step above, which runs only then.
      - name: Back up the sealed registry
        if: always() && steps.seal.outputs.registry_sealed == 'true' && (steps.seal.outputs.registry_changed == 'true' || steps.today.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-registry
          path: data/sealed/registry.enc
          retention-days: 90
          if-no-files-found: error
      - name: Save nflverse cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw/nflverse
          key: nflverse-${{ github.run_id }}
      - name: Upload the day's reply kit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reply-kit
          path: content/
          if-no-files-found: warn
      # The send log and the ledger, handed to commit-record, which pushes them
      # from a runner nothing here has touched. `always()`: a failed sweep
      # still records who WAS welcomed and which calls were delivered.
      - name: Hand the record to its commit job
        id: handoff
        if: always()
        env:
          RECORD_PATHS: data/processed/ledger data/processed/sent.jsonl
        run: |
          set -euo pipefail
          set -f
          stage="$RUNNER_TEMP/record"
          rm -rf "$stage"
          mkdir -p "$stage"
          git ls-files -z --cached --others --exclude-standard -- $RECORD_PATHS |
            while IFS= read -r -d '' path; do
              case "/$path" in */.git*) continue ;; esac
              [ -f "$path" ] && [ ! -L "$path" ] || continue
              mkdir -p "$stage/$(dirname "$path")"
              cp "$path" "$stage/$path"
            done
          if [ -n "$(find "$stage" -type f -print -quit)" ]; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing at the record's paths to hand over"
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi
      # overwrite: a re-run of this job replaces the record its first attempt
      # left, rather than failing on the name and persisting nothing.
      - name: Upload the record
        if: always() && steps.handoff.outputs.staged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-record
          path: ${{ runner.temp }}/record/
          if-no-files-found: error
          overwrite: true
      - name: Fail the run if a paid signup could not be served
        if: always() && steps.intake.outputs.code == '1'
        run: |
          echo "run.intake exited 1 — a paid signup is blocked, Stripe could not"
          echo "be read, or League Pass seat links match no pass (a rotated"
          echo "UPDATE_SECRET). See the sweep step's log."
          exit 1
      # Exit 2 is "STRIPE_API_KEY unset", the expected pre-launch state.
      # A monthly subscription left with no stop date WILL be charged through
      # the offseason, against a promise in the operative contract. That is a
      # failure, not a note: the issue below is filed only on one.
      - name: Fail the run if monthly billing could not be stopped
        if: always() && steps.billing.outputs.code == '1'
        run: |
          echo "::error::A monthly subscription is billing with no end-of-season"
          echo "::error::stop date. See the 'Stop monthly billing' step above."
          exit 1

      - name: Fail the run if a renewal notice could not be sent
        if: always() && steps.renewals.outputs.code == '1'
        run: |
          echo "run.renewals exited 1 — a legally-owed pre-renewal notice was"
          echo "not sent. See that step's log."
          exit 1
      # ONE open issue per kind of failure: a later failure comments on the
      # open one instead of opening another. Before launch these crons filed
      # 16 near-identical issues, which teaches exactly the wrong habit. The
      # title carries no date for that reason; each comment does. Listed, not
      # searched: the search index can lag a fresh issue by minutes.
      - name: Raise an issue if the sweep failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Daily signup sweep failed
        run: |
          body="$(date -u +%Y-%m-%d): a paid signup may be blocked, Stripe was
          unreadable, a renewal notice or a free report was not sent, monthly billing could
          not be stopped, or the sealed registry could not be opened or sealed (CACHE_KEY).
          See the run.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty' || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --label bug \
              || gh issue create --title "$TITLE" --body "$body" || true
          fi
      # AFTER the general issue step, deliberately: that step fires on
      # failure(), and failing the job first would also file a misleading
      # "signup sweep failed" issue for a run that was merely missed.
      - name: Raise an issue if a scheduled run did not happen
        if: always() && steps.watchdog.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: A scheduled run did not happen
        run: |
          body="$(date -u +%Y-%m-%d):

          $(cat "$RUNNER_TEMP/watchdog.txt")

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty' || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --label bug \
              || gh issue create --title "$TITLE" --body "$body" || true
          fi
      - name: Fail the run if a scheduled run did not happen
        if: always() && steps.watchdog.outputs.code == '1'
        run: |
          echo "::error::A scheduled run this week left no trace. See the"
          echo "::error::'Check this week's scheduled runs happened' step."
          exit 1

  # The send log and the ledger, pushed from a runner that installs nothing
  # and runs nothing but git and the shell (SEC-1): the artifact must hold
  # plain files at those paths and nothing else, and is laid on the commit
  # `intake` started from and rebased, so the Tuesday or Saturday run's lines
  # pushed in between are merged (merge=union), never overwritten.
  # `always()`, as the persist step it replaces had.
  commit-record:
    needs: intake
    if: always() && needs.intake.outputs.staged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the record; nothing else
    steps:
      # fetch-depth: 0: the starting commit is checked against this branch's
      # history, and `git pull --rebase` against a shallow history can fail.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      # Outside the checkout: nothing in it reaches the work tree until the
      # check below has passed it.
      - name: Download the record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daily-record
          path: ${{ runner.temp }}/record
      - name: Check the record and lay it on the intake job's commit
        env:
          BASE: ${{ needs.intake.outputs.base }}
          RECORD_ALLOWED: /data/processed/ledger/* /data/processed/sent.jsonl
        run: |
          set -euo pipefail
          set -f
          record="$RUNNER_TEMP/record"
          # The starting commit must be on this branch: rebasing from anywhere
          # else would push whatever lies between it and here.
          if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$BASE" HEAD; then
            echo "::error::the starting commit is not on this branch; nothing was persisted"
            exit 1
          fi
          odd=$(find "$record" -mindepth 1 ! -type f ! -type d -print -quit)
          if [ -n "$odd" ]; then
            echo "::error::the artifact holds something that is not a plain file; nothing was persisted"
            exit 1
          fi
          files=()
          while IFS= read -r -d '' file; do
            path=${file#"$record"/}
            ok=
            case "/$path" in
              */.git*) ;;
              *) for allowed in $RECORD_ALLOWED; do
                   case "/$path" in $allowed) ok=1 ;; esac
                 done ;;
            esac
            if [ -z "$ok" ]; then
              printf '::error::the artifact holds %q, which this job never commits; nothing was persisted\n' "$path"
              exit 1
            fi
            files+=("$path")
          done < <(find "$record" -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the artifact is empty; nothing was persisted"
            exit 1
          fi
          git reset -q --hard "$BASE"
          for folder in ${RECORD_REPLACES:-}; do
            rm -rf "$folder"
          done
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            cp "$record/$path" "$path"
          done
          echo "${#files[@]} file(s) laid on $BASE"
      # sent.jsonl is the only record of who was welcomed. Losing it means
      # double-welcoming everyone; merge=union (.gitattributes) keeps the
      # push race with the other crons a concatenation, not a conflict.
      #
      # The ledger rides the same commit (OPS-R2). Between Tuesday's send and
      # kickoff this sweep mails a new buyer — or a newly confirmed seat —
      # that week's report, and run.intake records its calls once delivered
      # (record_delivered). Staging only sent.jsonl committed the key that
      # stops the report being rebuilt and let its calls die with the runner:
      # published odds that never reached the public record.
      #
      # The only step handed a token that can push. The credential helper reads
      # it from this step's environment, so .git/config holds the helper, never
      # the token.
      - name: Persist the send log and the record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SEC-1: no hook or fsmonitor command an earlier step left in .git (or
          # in any git config file) runs beside the token: config given on the
          # command line outranks them all, for every git call below.
          git() { command git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          git add -A data/processed/ledger
          [ -f data/processed/sent.jsonl ] && git add data/processed/sent.jsonl || true
          git diff --cached --quiet && echo "nothing to persist" && exit 0
          git commit -m "Daily sweep: send log and ledger"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push

  # The sweep raises its own failures (above); a push that failed after it is
  # raised here, under the same title, so it comments on the same open issue.
  file-issue:
    needs: commit-record
    if: always() && needs.commit-record.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write     # one open issue per kind of failure
    steps:
      - name: Raise an issue if the send log could not be pushed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Daily signup sweep failed
        run: |
          body="$(date -u +%Y-%m-%d): the sweep ran but its send log and ledger never reached the
          branch, so the next run may welcome the same buyers again. Re-run failed jobs
          pushes the same record.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty' || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --label bug \
              || gh issue create --title "$TITLE" --body "$body" || true
          fi
